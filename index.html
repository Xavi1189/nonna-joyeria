    render();
  });
  document.querySelectorAll('[data-row-image-file]').forEach(input => input.onchange = async (e) => {
    const rowId = input.dataset.rowImageFile;
    const file = e.target.files[0];
    if(!file) return;
    try{
      const dataUrl = await resizeImageFile(file, 700, 0.82);
      captureLoteFormState();
      const row = state.loteFormRows.find(r => r.id === rowId);
      if(row) row.image = dataUrl;
      render();
    }catch(err){ notify('No se pudo procesar la imagen. Intenta con otra foto.'); }
  });
  document.querySelectorAll('[data-row-image-remove]').forEach(b => b.onclick = () => {
    captureLoteFormState();
    const row = state.loteFormRows.find(r => r.id === b.dataset.rowImageRemove);
    if(row) row.image = '';
    render();
  });
  const lfCancel = document.getElementById('lf_cancel');
  if(lfCancel) lfCancel.onclick = () => { state.creatingLote = false; state.loteFormRows = []; state.loteFormMeta = null; state.loteFormTargetId = null; render(); };
  const lfSave = document.getElementById('lf_save');
  if(lfSave) lfSave.onclick = saveLoteForm;
  state.loteFormRows.forEach(row => bindCategoryToggle('row_cat_'+row.id));
  document.querySelectorAll('[data-view-lote]').forEach(tr => tr.onclick = () => { state.viewingLoteId = tr.dataset.viewLote; render(); });
  const backToLotes = document.getElementById('backToLotes');
  if(backToLotes) backToLotes.onclick = () => { state.viewingLoteId = null; render(); };
  document.querySelectorAll('[data-delete-lote]').forEach(b => b.onclick = () => deleteLote(b.dataset.deleteLote));

  // Ventas
  document.querySelectorAll('[data-view-sale]').forEach(tr => tr.onclick = () => { state.viewingSaleId = tr.dataset.viewSale; render(); });
  const backBtn = document.getElementById('backToVentas');
  if(backBtn) backBtn.onclick = () => { state.viewingSaleId = null; render(); };
  const ventasSearchInput = document.getElementById('ventasSearchInput');
  if(ventasSearchInput) ventasSearchInput.oninput = (e) => { state.ventasSearch = e.target.value; state.ventasPage = 1; render(); };
  document.querySelectorAll('[data-goto-customer]').forEach(b => b.onclick = () => {
    state.adminTab = 'cuentas';
    state.viewingCustomerPhone = b.dataset.gotoCustomer;
    state.viewingSaleId = null;
    render();
  });

  // Cuentas
  document.querySelectorAll('[data-view-customer]').forEach(tr => tr.onclick = () => { state.viewingCustomerPhone = tr.dataset.viewCustomer; render(); });
  document.querySelectorAll('[data-delete-customer]').forEach(b => b.onclick = (e) => { e.stopPropagation(); confirmDeleteCustomer(b.dataset.deleteCustomer); });
  const cuentasSearchInput = document.getElementById('cuentasSearchInput');
  if(cuentasSearchInput) cuentasSearchInput.oninput = (e) => { state.cuentasSearch = e.target.value; state.cuentasPage = 1; render(); };
  const backToCuentas = document.getElementById('backToCuentas');
  if(backToCuentas) backToCuentas.onclick = () => { state.viewingCustomerPhone = null; render(); };
  document.querySelectorAll('[data-page-prev]').forEach(b => b.onclick = () => {
    const kind = b.dataset.pagePrev;
    if(kind==='ventas') state.ventasPage = Math.max(1, (state.ventasPage||1)-1);
    if(kind==='cuentas') state.cuentasPage = Math.max(1, (state.cuentasPage||1)-1);
    render();
  });
  document.querySelectorAll('[data-page-next]').forEach(b => b.onclick = () => {
    const kind = b.dataset.pageNext;
    if(kind==='ventas') state.ventasPage = (state.ventasPage||1)+1;
    if(kind==='cuentas') state.cuentasPage = (state.cuentasPage||1)+1;
    render();
  });
  const registrarAbono = document.getElementById('registrarAbono');
  if(registrarAbono) registrarAbono.onclick = registrarAbonoHandler;
  document.querySelectorAll('[data-confirm-abono-req]').forEach(b => b.onclick = () => confirmAbonoRequest(b.dataset.confirmAbonoReq));
  document.querySelectorAll('[data-dismiss-abono-req]').forEach(b => b.onclick = () => dismissAbonoRequest(b.dataset.dismissAbonoReq));

  // Solicitudes
  document.querySelectorAll('[data-req-accept]').forEach(b => b.onclick = () => acceptRequest(b.dataset.reqAccept));
  document.querySelectorAll('[data-req-reject]').forEach(b => b.onclick = () => rejectRequest(b.dataset.reqReject));
  const stgSave = document.getElementById('stg_save');
  if(stgSave) stgSave.onclick = async () => {
    const val = document.getElementById('stg_whatsapp').value.replace(/\D/g,'');
    if(val.length !== 10){ notify('Ingresa un número de WhatsApp válido a 10 dígitos.'); return; }
    stgSave.disabled = true; stgSave.textContent = 'Guardando…';
    state.settings.whatsappNumber = val;
    state.settings.paymentInfo = {
      bankName: document.getElementById('stg_bank').value.trim(),
      accountHolder: document.getElementById('stg_holder').value.trim(),
      accountNumber: document.getElementById('stg_account').value.trim(),
      cardNumber: document.getElementById('stg_card').value.trim(),
    };
    const ok = await saveSettings();
    notify(ok ? 'Configuración guardada.' : 'No se pudo guardar la configuración. Verifica tu conexión e intenta de nuevo.');
  };
  const stgThemeMode = document.getElementById('stg_theme_mode');
  if(stgThemeMode) stgThemeMode.onchange = () => {
    const mode = stgThemeMode.value;
    state.settings.themeOverride = mode==='none' ? 'none' : (mode==='fixed' ? new Date().getMonth() : undefined);
    render();
  };
  const stgThemeSave = document.getElementById('stg_theme_save');
  if(stgThemeSave) stgThemeSave.onclick = async () => {
    const mode = document.getElementById('stg_theme_mode').value;
    if(mode === 'none') state.settings.themeOverride = 'none';
    else if(mode === 'fixed') state.settings.themeOverride = Number(document.getElementById('stg_theme_month').value);
    else state.settings.themeOverride = undefined;
    stgThemeSave.disabled = true; stgThemeSave.textContent = 'Guardando…';
    const ok = await saveSettings();
    applySeasonalTheme();
    notify(ok ? 'Tema de temporada guardado.' : 'No se pudo guardar el tema. Verifica tu conexión e intenta de nuevo.');
  };

  // Modal
  const modalOverlay = document.getElementById('modalOverlay');
  if(modalOverlay) modalOverlay.onclick = (e) => { if(e.target.id==='modalOverlay'){ state.modal=null; render(); } };
  const modalClose = document.getElementById('modalClose');
  if(modalClose) modalClose.onclick = () => { state.modal=null; render(); };
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copyToClipboardBtn(b, b.dataset.copy));
  const sendWhatsapp = document.getElementById('sendWhatsapp');
  if(sendWhatsapp) sendWhatsapp.onclick = () => {
    const phone = document.getElementById('ticketPhone').value;
    window.open(whatsappLink(state.modal.text, phone), '_blank');
  };
  const reqSend = document.getElementById('req_send');
  if(reqSend) reqSend.onclick = submitRequestInfo;
  document.querySelectorAll('[data-cr-mode]').forEach(b => b.onclick = () => {
    const antEl = document.getElementById('cr_anticipo');
    if(antEl) state.modal.anticipo = antEl.value;
    state.modal.mode = b.dataset.crMode;
    if(state.modal.mode === 'contado') state.modal.anticipo = null;
    render();
  });
  document.querySelectorAll('[data-cr-method]').forEach(b => b.onclick = () => {
    const antEl = document.getElementById('cr_anticipo');
    if(antEl) state.modal.anticipo = antEl.value;
    state.modal.method = b.dataset.crMethod;
    if(state.modal.method !== 'transferencia') state.modal.receiptImage = '';
    render();
  });
  const crReceiptFile = document.getElementById('cr_receipt_file');
  if(crReceiptFile) crReceiptFile.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try{
      const dataUrl = await resizeImageFile(file, 900, 0.8);
      const antEl = document.getElementById('cr_anticipo');
      if(antEl) state.modal.anticipo = antEl.value;
      state.modal.receiptImage = dataUrl;
      state.modal.error = '';
      render();
    }catch(err){ notify('No se pudo procesar la imagen del comprobante.'); }
  };
  const crReceiptRemove = document.getElementById('cr_receipt_remove');
  if(crReceiptRemove) crReceiptRemove.onclick = () => {
    const antEl = document.getElementById('cr_anticipo');
    if(antEl) state.modal.anticipo = antEl.value;
    state.modal.receiptImage = '';
    render();
  };
  const crConfirm = document.getElementById('crConfirm');
  if(crConfirm) crConfirm.onclick = completeRequestPurchase;
  document.querySelectorAll('[data-sa-method]').forEach(b => b.onclick = () => {
    const amtEl = document.getElementById('sa_amount');
    if(amtEl) state.modal.amount = amtEl.value;
    state.modal.method = b.dataset.saMethod;
    if(state.modal.method !== 'transferencia') state.modal.receiptImage = '';
    render();
  });
  const saReceiptFile = document.getElementById('sa_receipt_file');
  if(saReceiptFile) saReceiptFile.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try{
      const dataUrl = await resizeImageFile(file, 900, 0.8);
      const amtEl = document.getElementById('sa_amount');
      if(amtEl) state.modal.amount = amtEl.value;
      state.modal.receiptImage = dataUrl;
      state.modal.error = '';
      render();
    }catch(err){ notify('No se pudo procesar la imagen del comprobante.'); }
  };
  const saReceiptRemove = document.getElementById('sa_receipt_remove');
  if(saReceiptRemove) saReceiptRemove.onclick = () => {
    const amtEl = document.getElementById('sa_amount');
    if(amtEl) state.modal.amount = amtEl.value;
    state.modal.receiptImage = '';
    render();
  };
  const saSend = document.getElementById('sa_send');
  if(saSend) saSend.onclick = submitSelfAbono;
  const confirmYes = document.getElementById('confirmYes');
  if(confirmYes) confirmYes.onclick = async () => {
    const cb = state.modal && state.modal.onConfirm;
    state.modal = null;
    if(cb) await cb();
    render();
  };
  const confirmNo = document.getElementById('confirmNo');
  if(confirmNo) confirmNo.onclick = () => { state.modal = null; render(); };
  const notifyOk = document.getElementById('notifyOk');
  if(notifyOk) notifyOk.onclick = () => { state.modal = null; render(); };

  // Cuentas: dar de alta clienta / generar-restablecer contraseña (admin)
  const btnAdminNewCustomer = document.getElementById('btnAdminNewCustomer');
  if(btnAdminNewCustomer) btnAdminNewCustomer.onclick = () => {
    state.modal = {type:'adminSetPassword', isNew:true, name:'', phone:'', error:''};
    render();
  };
  document.querySelectorAll('[data-admin-password]').forEach(b => b.onclick = () => {
    state.modal = {type:'adminSetPassword', isNew:false, name:b.dataset.adminPasswordName||'', phone:b.dataset.adminPassword, error:''};
    render();
  });
  const aspGenerate = document.getElementById('asp_generate');
  if(aspGenerate) aspGenerate.onclick = () => {
    const pwField = document.getElementById('asp_password');
    if(pwField) pwField.value = generateRandomPassword();
  };
  const aspSave = document.getElementById('asp_save');
  if(aspSave) aspSave.onclick = async () => {
    const name = document.getElementById('asp_name').value.trim();
    const phone = document.getElementById('asp_phone').value.replace(/\D/g,'');
    const password = document.getElementById('asp_password').value;
    const debt = Number(document.getElementById('asp_debt').value || 0);
    if(!name){ state.modal.error = 'Ingresa el nombre.'; render(); return; }
    if(phone.length !== 10){ state.modal.error = 'Ingresa un teléfono válido a 10 dígitos.'; render(); return; }
    if(password.length < 6){ state.modal.error = 'La contraseña debe tener al menos 6 caracteres.'; render(); return; }
    if(debt < 0){ state.modal.error = 'El adeudo inicial no puede ser negativo.'; render(); return; }

    aspSave.disabled = true; aspSave.textContent = 'Guardando…';

    const { error } = await sb.rpc('admin_set_customer_password', {p_phone: phone, p_name: name, p_password: password});
    if(error){
      state.modal.error = 'No se pudo guardar. Detalle técnico: ' + (error.message || error.details || error.hint || 'desconocido') + '. Verifica tu conexión o intenta cerrar sesión y volver a entrar.';
      aspSave.disabled = false; aspSave.textContent = 'Guardar'; render(); return;
    }

    let existing = state.customers.find(c=>c.phone===phone);
    if(!existing){ state.customers.push({phone, name}); }
    else { existing.name = name; }

    let debtOk = true;
    if(debt > 0){ debtOk = await recordOpeningBalance(phone, name, debt); }

    state.modal = null;
    if(debt > 0 && !debtOk){
      notify('Se guardó la contraseña de ' + name + ', pero NO se pudo registrar su adeudo inicial. Detalle técnico: ' + (lastSaveError||'desconocido') + '. Intenta registrarlo de nuevo desde su cuenta.');
    } else {
      notify('Contraseña guardada para ' + name + '. Compártesela para que pueda entrar a Mi Cuenta.' + (debt>0 ? ' Se registró su adeudo inicial de '+money(debt)+'.' : ''));
    }
  };

  // Mi Cuenta: cambiar mi propia contraseña
  const cpSave = document.getElementById('cp_save');
  if(cpSave) cpSave.onclick = async () => {
    const current = document.getElementById('cp_current').value;
    const nw = document.getElementById('cp_new').value;
    const confirmNew = document.getElementById('cp_confirm').value;
    if(nw.length < 6){ state.modal.error = 'La nueva contraseña debe tener al menos 6 caracteres.'; render(); return; }
    if(nw !== confirmNew){ state.modal.error = 'Las contraseñas nuevas no coinciden.'; render(); return; }

    const { data, error } = await sb.rpc('customer_change_password', {p_phone: state.clientPhone, p_current_password: current, p_new_password: nw});
    if(error || data === 'error'){ state.modal.error = 'Tu contraseña actual no es correcta.'; render(); return; }

    state.modal = null;
    notify('Tu contraseña se actualizó correctamente.');
  };

  // Enlace directo desde la notificación de "Nuevo pago por confirmar": desplaza y resalta esa tarjeta.
  if(state.deepLinkPaymentId && !state.deepLinkScrolled && state.view==='admin' && state.adminTab==='solicitudes' && state.adminAuthed){
    const el = document.getElementById('pr-'+state.deepLinkPaymentId);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); state.deepLinkScrolled = true; }
  }
}

/* ---- handlers ---- */
function addToCart(productId){
  const p = state.products.find(pp=>pp.id===productId);
  if(!p) return;
  const existing = state.cart.find(c=>c.productId===productId);
  const inCartQty = existing ? existing.qty : 0;
  if(inCartQty + 1 > productStock(p)) return;
  if(existing) existing.qty += 1;
  else state.cart.push({productId, qty:1});
  render();
}
function changeQty(productId, delta){
  const line = state.cart.find(c=>c.productId===productId);
  const p = state.products.find(pp=>pp.id===productId);
  if(!line || !p) return;
  line.qty += delta;
  const avail = productStock(p);
  if(line.qty > avail) line.qty = avail;
  if(line.qty <= 0) state.cart = state.cart.filter(c=>c.productId!==productId);
  render();
}

async function completeRequestPurchase(){
  const req = state.requests.find(r=>r.id===state.modal.requestId);
  if(!req){ state.modal = null; render(); return; }
  const mode = state.modal.mode || 'contado';
  const total = req.total;
  const anticipo = mode === 'contado' ? total : Number((document.getElementById('cr_anticipo')||{}).value || 0);
  const method = state.modal.method || 'transferencia';

  if(mode === 'abonos' && (anticipo <= 0 || anticipo > total)){
    state.modal.error = 'El anticipo debe ser mayor a 0 y no exceder el total.';
    render(); return;
  }
  if(method === 'transferencia' && !state.modal.receiptImage){
    state.modal.error = 'Adjunta tu comprobante de transferencia para continuar.';
    render(); return;
  }

  const crConfirmBtn = document.getElementById('crConfirm');
  if(crConfirmBtn){ crConfirmBtn.disabled = true; crConfirmBtn.textContent = 'Guardando…'; }

  // validación rápida en el cliente (para dar feedback inmediato)
  for(const it of req.items){
    const p = state.products.find(x=>x.id===it.productId);
    if(!p || productStock(p) < it.qty){
      state.modal.error = 'Ya no hay existencia suficiente de ' + it.name + '.';
      if(crConfirmBtn){ crConfirmBtn.disabled = false; crConfirmBtn.textContent = 'Confirmar compra'; }
      render(); return;
    }
  }

  // Descuento real y a prueba de condiciones de carrera: esta función bloquea
  // cada artículo mientras lo procesa, así dos compras simultáneas por la
  // última pieza nunca pueden vender lo mismo dos veces.
  const { data: breakdownResult, error: stockError } = await sb.rpc('consume_stock_multi', {
    items: req.items.map(it => ({productId: it.productId, qty: it.qty})),
  });
  if(stockError){
    state.modal.error = 'Ya no hay existencia suficiente de uno de los artículos — alguien más lo compró justo antes.';
    if(crConfirmBtn){ crConfirmBtn.disabled = false; crConfirmBtn.textContent = 'Confirmar compra'; }
    render(); return;
  }

  const saleItems = req.items.map(it => {
    const bd = (breakdownResult||[]).find(b=>b.productId===it.productId);
    return {productId:it.productId, name:it.name, qty:it.qty, price:it.price, loteBreakdown: bd ? bd.loteBreakdown : []};
  });

  // Refresca localmente los artículos afectados para reflejar la existencia real.
  const { data: freshProducts } = await sb.from('products').select('*').in('id', req.items.map(it=>it.productId));
  (freshProducts||[]).forEach(row => {
    const updated = dbToProduct(row);
    const idx = state.products.findIndex(p=>p.id===updated.id);
    if(idx >= 0) state.products[idx] = updated;
  });

  let cust = state.customers.find(c=>c.phone===req.customerPhone);
  if(!cust){ cust = {phone:req.customerPhone, name:req.customerName}; state.customers.push(cust); await insertRow('customers', customerToDb, cust); }

  const sale = {
    id: genId('V'),
    customerPhone: req.customerPhone,
    customerName: req.customerName,
    items: saleItems,
    total,
    date: new Date().toISOString(),
  };
  state.sales.push(sale);
  const savedSale = await insertRow('sales', saleToDb, sale);
  if(!savedSale){
    if(crConfirmBtn){ crConfirmBtn.disabled = false; crConfirmBtn.textContent = 'Confirmar compra'; }
    notify('Ya se descontó la existencia pero no se pudo registrar tu compra. Detalle técnico: ' + (lastSaveError||'desconocido') + '. Avísale a la tienda para que lo revisen — no vuelvas a intentar completar esta compra por ahora.');
    return;
  }

  req.status = 'completada';
  await updateRowFields('requests', 'id', req.id, {status:'completada'});

  // El pago queda pendiente de tu confirmación; el ticket se envía automáticamente cuando lo confirmes.
  const receiptUrl = method==='transferencia'
    ? await uploadDataUrlToStorage(state.modal.receiptImage || '', 'payment-receipts', 'comprobantes')
    : '';
  const pr = {
    id: genId('PC'),
    type: 'compra',
    saleId: sale.id,
    customerPhone: req.customerPhone,
    customerName: req.customerName,
    amount: anticipo,
    method,
    receiptImage: receiptUrl,
    date: new Date().toISOString(),
    status: 'pendiente',
  };
  state.abonoRequests.push(pr);
  const savedPr = await insertRow('payment_requests', paymentRequestToDb, pr);
  if(!savedPr){
    state.abonoRequests = state.abonoRequests.filter(x => x.id !== pr.id);
    notify('Tu compra se registró, pero no se pudo enviar tu pago para que lo confirmemos. Detalle técnico: ' + (lastSaveError||'desconocido') + '. Contacta a la tienda para confirmar tu pago manualmente.');
    return;
  }
  window.open(whatsappLink(buildPaymentPendingMessage(pr), state.settings.whatsappNumber), '_blank');

  state.clientPhone = req.customerPhone;
  state.clientName = req.customerName;
  notify('Tu compra fue registrada. En cuanto confirmemos tu pago, te enviaremos el ticket por WhatsApp.');
}

async function confirmAbonoRequest(id){
  const r = state.abonoRequests.find(x=>x.id===id);
  if(!r) return;
  const methodLabel = r.method === 'transferencia' ? 'Transferencia' : 'Efectivo';
  if(state.deepLinkPaymentId === id) state.deepLinkPaymentId = null;

  if(r.type === 'compra'){
    const payment = {id:genId('AB'), customerPhone:r.customerPhone, amount:r.amount, date:new Date().toISOString().slice(0,10), method:methodLabel};
    state.payments.push(payment);
    const savedPayment = await insertRow('payments', paymentToDb, payment);
    if(!savedPayment){
      state.payments = state.payments.filter(p=>p.id!==payment.id);
      notify('No se pudo confirmar el pago. Detalle técnico: ' + (lastSaveError||'desconocido') + '. Verifica tu conexión o vuelve a iniciar sesión.');
      render();
      return;
    }
    r.status = 'confirmado';
    const savedPr = await updateRowFields('payment_requests', 'id', id, {status:'confirmado'});
    if(!savedPr){
      notify('El pago se registró, pero no se pudo actualizar su estado a "confirmado". Detalle técnico: ' + (lastSaveError||'desconocido') + '. Vuelve a intentar confirmarlo.');
      r.status = 'pendiente';
      render();
      return;
    }
    const sale = state.sales.find(s=>s.id===r.saleId);
    if(sale) window.open(whatsappLink(buildTicket(sale), r.customerPhone), '_blank');
    render();
    return;
  }

  // type 'abono'
  const saldo = customerSaldo(r.customerPhone);
  if(saldo <= 0){
    r.status = 'confirmado';
    const savedPr = await updateRowFields('payment_requests', 'id', id, {status:'confirmado'});
    if(!savedPr){
      r.status = 'pendiente';
      notify('No se pudo actualizar la solicitud. Detalle técnico: ' + (lastSaveError||'desconocido'));
      render();
      return;
    }
    notify('Esta clienta ya no tiene saldo pendiente; se descartó la solicitud sin registrar un abono nuevo.');
    return;
  }
  const monto = Math.min(r.amount, saldo); // por si el saldo cambió desde que se solicitó
  const payment = {id:genId('AB'), customerPhone:r.customerPhone, amount:monto, date:new Date().toISOString().slice(0,10), method:methodLabel};
  state.payments.push(payment);
  const savedPayment = await insertRow('payments', paymentToDb, payment);
  if(!savedPayment){
    state.payments = state.payments.filter(p=>p.id!==payment.id);
    notify('No se pudo registrar el abono. Detalle técnico: ' + (lastSaveError||'desconocido') + '. Verifica tu conexión o vuelve a iniciar sesión.');
    render();
    return;
  }
  r.status = 'confirmado';
  const savedPr2 = await updateRowFields('payment_requests', 'id', id, {status:'confirmado'});
  if(!savedPr2){
    notify('El abono se registró, pero no se pudo actualizar su estado a "confirmado". Detalle técnico: ' + (lastSaveError||'desconocido') + '. Vuelve a intentar confirmarlo.');
    r.status = 'pendiente';
    render();
    return;
  }
  window.open(whatsappLink(buildAccountStatement(r.customerPhone), r.customerPhone), '_blank');
  render();
}

async function saveLoteForm(){
  captureLoteFormState();
  const meta = state.loteFormMeta || {};
  const provider = (meta.provider||'').trim();
  const reference = (meta.reference||'').trim();
  const notes = (meta.notes||'').trim();
  if(!provider){ notify('Indica el proveedor de esta recepción.'); return; }

  const validRows = state.loteFormRows.filter(row => {
    if(row.existingProductId) return Number(row.qty||0) > 0;
    return row.category && Number(row.price||0) > 0 && Number(row.qty||0) > 0;
  });
  if(validRows.length === 0){ notify('Agrega al menos un artículo (nuevo o ya existente) con cantidad válida.'); return; }

  const lfSaveBtn = document.getElementById('lf_save');
  if(lfSaveBtn){ lfSaveBtn.disabled = true; lfSaveBtn.textContent = 'Guardando…'; }

  const items = [];
  for(const row of validRows){
    if(row.existingProductId){
      const existingP = state.products.find(p=>p.id===row.existingProductId);
      if(!existingP) continue;
      items.push({
        existingProductId: row.existingProductId,
        qty: Number(row.qty || 0),
      });
    } else {
      const image = await uploadDataUrlToStorage(row.image || '', 'product-images', 'productos');
      items.push({
        category: row.category,
        price: Number(row.price || 0),
        qty: Number(row.qty || 0),
        name: (row.name||'').trim(),
        image,
      });
    }
  }

  let lote;
  const isContinuation = !!state.loteFormTargetId;

  if(isContinuation){
    lote = state.lotes.find(l => l.id === state.loteFormTargetId);
    if(!lote){ notify('No se encontró la recepción seleccionada.'); return; }
    // Es la misma recepción y el mismo periodo: solo se actualizan proveedor/referencia/notas
    // por si se editaron. El periodo (fechas) no cambia, y NO se cierra existencia anterior.
    lote.provider = provider;
    lote.reference = reference;
    lote.notes = notes;
  } else {
    const periodStart = meta.periodStart || '';
    const periodEnd = meta.periodEnd || '';
    if(!periodStart || !periodEnd){ notify('Indica el periodo (del / al) que corresponde a esta recepción.'); return; }
    if(periodEnd < periodStart){ notify('La fecha final del periodo no puede ser anterior a la fecha inicial.'); return; }
    lote = {id:genId('L'), date:periodStart, endDate:periodEnd, provider, reference, notes, items:[]};
    // Solo al iniciar una recepción NUEVA (un periodo nuevo) se entrega de vuelta al
    // proveedor la existencia no vendida de recepciones anteriores.
    closeOutPreviousStock(lote.id, periodStart);
    state.lotes.push(lote);
  }

  items.forEach(it => {
    let p;
    if(it.existingProductId){
      // La admin eligió explícitamente sumar existencia a un artículo que ya tenía en su catálogo.
      p = state.products.find(pp => pp.id === it.existingProductId);
      if(!p) return;
    } else {
      // Cada renglón nuevo es un artículo distinto — ya no se agrupan automáticamente
      // por categoría y precio, para no mezclar piezas diferentes bajo una sola foto.
      p = {id:genId('P'), name: it.name || it.category, sku:'', category: it.category, price: it.price, desc:'', image: it.image || '', stockEntries:[]};
      state.products.push(p);
    }
    p.stockEntries = p.stockEntries || [];
    let entry = p.stockEntries.find(e => e.loteId === lote.id);
    if(entry){ entry.qty += it.qty; }
    else { p.stockEntries.push({loteId:lote.id, qty:it.qty}); }

    let loteItem = lote.items.find(li => li.productId === p.id);
    if(loteItem){ loteItem.qtyReceived += it.qty; }
    else { lote.items.push({productId:p.id, name:p.name, qtyReceived:it.qty}); }
  });

  const savedProducts = await saveProducts();
  const productsErr = savedProducts ? '' : lastSaveError;
  const savedLotes = await saveLotes();
  const lotesErr = savedLotes ? '' : lastSaveError;
  const savedReturns = await saveReturns();
  const returnsErr = savedReturns ? '' : lastSaveError;
  state.creatingLote = false;
  state.loteFormRows = [];
  state.loteFormMeta = null;
  state.loteFormTargetId = null;
  render();
  if(!savedProducts || !savedLotes || !savedReturns){
    const detail = [productsErr, lotesErr, returnsErr].filter(Boolean).join(' | ');
    notify('La recepción se guardó a medias. Detalle técnico: ' + (detail || 'desconocido') + '. Verifica tu conexión, o que tu sesión de administrador siga activa (intenta cerrar sesión y volver a entrar), y revisa que los artículos hayan quedado bien en Inventario.');
  }
}

async function saveProductForm(){
  const name = document.getElementById('pf_name').value.trim();
  const sku = document.getElementById('pf_sku').value.trim();
  const category = readCategoryField('pf_category');
  const price = Number(document.getElementById('pf_price').value || 0);
  const desc = document.getElementById('pf_desc').value.trim();
  const onSale = !!(state.productFormDraft && state.productFormDraft.onSale);
  let salePrice = null;
  if(onSale){
    const spEl = document.getElementById('pf_sale_price');
    salePrice = spEl ? Number(spEl.value || 0) : 0;
    if(!salePrice || salePrice <= 0){ notify('Indica un precio de oferta válido.'); return; }
    if(salePrice >= price){ notify('El precio de oferta debe ser menor al precio normal.'); return; }
  }
  if(!name || !category || price < 0){ notify('Completa nombre, categoría y precio válidos.'); return; }

  const pfSaveBtn = document.getElementById('pf_save');
  if(pfSaveBtn){ pfSaveBtn.disabled = true; pfSaveBtn.textContent = 'Guardando…'; }
  const image = await uploadDataUrlToStorage(state.tempImageData || '', 'product-images', 'productos');

  const p = state.products.find(pp=>pp.id===state.editingProduct.id);
  const backup = p ? {...p} : null;
  if(p) Object.assign(p, {name, sku, category, price, desc, image, onSale, salePrice});
  const ok = await saveProducts();
  const errDetail = lastSaveError;
  state.editingProduct = null;
  state.tempImageData = '';

  render();
  if(!ok){ notify('No se pudo guardar el artículo. Detalle técnico: ' + (errDetail||'desconocido') + '. Verifica tu conexión, o que tu sesión de administrador siga activa (intenta cerrar sesión y volver a entrar).'); }
}

function deleteProduct(id){
  const p = state.products.find(pp=>pp.id===id);
  const label = p ? `"${p.name}"` : 'este artículo';
  openConfirm(`¿Eliminar ${label} del catálogo? Esta acción no se puede deshacer.`, async () => {
    const backup = [...state.products];
    state.products = state.products.filter(pp=>pp.id!==id);

    if(!ok){
      state.products = backup;
      notify('No se pudo eliminar el artículo. Detalle técnico: ' + (lastSaveError||'desconocido') + '. Puede que ya esté ligado a una devolución registrada, o que tu sesión de administrador haya expirado — intenta cerrar sesión y volver a entrar.');
    }
  }, 'Sí, eliminar');
}

function deleteLote(id){
  const l = state.lotes.find(x=>x.id===id);
  if(!l) return;
  let soldQty = 0;
  state.sales.forEach(s => s.items.forEach(i => (i.loteBreakdown||[]).forEach(lb => { if(lb.loteId===id) soldQty += lb.qty; })));
  const warning = soldQty > 0
    ? ` Ya se vendieron ${soldQty} pieza(s) de esta recepción; esas compras no se van a borrar, pero perderán su referencia a esta recepción en la trazabilidad.`
    : '';
  openConfirm(
    `¿Eliminar la recepción del ${loteDateRange(l)} (${esc(l.provider)})?${warning} Se quitará del inventario la existencia que quedaba sin vender de esta recepción. Esta acción no se puede deshacer.`,
    async () => {
      state.products.forEach(p => { p.stockEntries = (p.stockEntries||[]).filter(e => e.loteId !== id); });
      await saveProducts();
      state.returns = state.returns.filter(r => r.loteId !== id && r.newLoteId !== id);
      await saveReturns();
      state.lotes = state.lotes.filter(x=>x.id!==id);
      await saveLotes();
      if(state.viewingLoteId === id) state.viewingLoteId = null;
      if(state.loteFormTargetId === id) state.loteFormTargetId = null;
    },
    'Sí, eliminar'
  );
}

// Al eliminar una clienta se le devuelve al inventario la existencia de lo que había comprado,
// para no dejar el catálogo con existencia descuadrada por cuentas de prueba eliminadas.
function restoreStockFromSale(sale){
  sale.items.forEach(it => {
    const p = state.products.find(pp=>pp.id===it.productId);
    if(!p) return;
    p.stockEntries = p.stockEntries || [];
    (it.loteBreakdown||[]).forEach(lb => {
      const entry = p.stockEntries.find(e=>e.loteId===lb.loteId);
      if(entry){ entry.qty += lb.qty; }
      else { p.stockEntries.push({loteId:lb.loteId, qty:lb.qty}); }
    });
  });
}

function confirmDeleteCustomer(phone){
  const c = state.customers.find(x=>x.phone===phone);
  const name = c ? c.name : phone;
  const salesCount = customerSales(phone).length;
  const paymentsCount = customerPayments(phone).length;
  const detail = salesCount>0 || paymentsCount>0
    ? ` Se borrarán ${salesCount} compra(s) y ${paymentsCount} abono(s) registrados, y se devolverá la existencia de los artículos vendidos.`
    : '';
  openConfirm(
    `¿Eliminar a "${name}" (${phone}) de tus clientas?${detail} Esta acción no se puede deshacer.`,
    () => deleteCustomerAccount(phone),
    'Sí, eliminar'
  );
}

async function deleteCustomerAccount(phone){
  const sales = customerSales(phone);
  const saleIds = sales.map(s=>s.id);
  const paymentIds = customerPayments(phone).map(p=>p.id);
  const requestIds = state.requests.filter(r=>r.customerPhone===phone).map(r=>r.id);
  const abonoReqIds = state.abonoRequests.filter(r=>r.customerPhone===phone).map(r=>r.id);

  sales.forEach(s => restoreStockFromSale(s));
  if(!await saveProducts()){
    notify('No se pudo actualizar el inventario. Detalle técnico: ' + (lastSaveError||'desconocido') + '. No se eliminó nada todavía — intenta de nuevo.');
    return;
  }
  if(!await deleteRows('sales', 'id', saleIds)){
    notify('No se pudieron eliminar sus compras. Detalle técnico: ' + (lastSaveError||'desconocido') + '. Se detuvo antes de tocar el resto de su información.');
    return;
  }
  if(!await deleteRows('payments', 'id', paymentIds)){
    notify('No se pudieron eliminar sus abonos. Detalle técnico: ' + (lastSaveError||'desconocido') + '. Se detuvo antes de tocar el resto de su información.');
    return;
  }
  if(!await deleteRows('requests', 'id', requestIds)){
    notify('No se pudieron eliminar sus solicitudes. Detalle técnico: ' + (lastSaveError||'desconocido') + '. Se detuvo antes de eliminar a la clienta.');
    return;
  }
  if(!await deleteRows('payment_requests', 'id', abonoReqIds)){
    notify('No se pudieron eliminar sus pagos por confirmar. Detalle técnico: ' + (lastSaveError||'desconocido') + '. Se detuvo antes de eliminar a la clienta.');
    return;
  }
  if(!await deleteRows('customers', 'phone', [phone])){
    notify('No se pudo eliminar a la clienta. Detalle técnico: ' + (lastSaveError||'desconocido') + '. El resto de su información ya se borró correctamente.');
    return;
  }

  state.sales = state.sales.filter(s=>s.customerPhone!==phone);
  state.payments = state.payments.filter(p=>p.customerPhone!==phone);
  state.requests = state.requests.filter(r=>r.customerPhone!==phone);
  state.abonoRequests = state.abonoRequests.filter(r=>r.customerPhone!==phone);
  state.customers = state.customers.filter(c=>c.phone!==phone);

  if(state.viewingCustomerPhone === phone) state.viewingCustomerPhone = null;
  if(state.clientPhone === phone){ state.clientPhone = ''; state.clientName = ''; }
}

/* ================= INIT ================= */
// Enlace directo de compra: cuando aceptas una solicitud, el mensaje de WhatsApp incluye un
// link con #compra=<id> que abre la app ya en Mi Cuenta, lista para completar esa compra.
function handleDeepLink(){
  const hash = window.location.hash || '';

  const mCompra = hash.match(/#compra=([^&]+)/);
  if(mCompra){
    const req = state.requests.find(r=>r.id===decodeURIComponent(mCompra[1]));
    if(req){
      state.clientPhone = req.customerPhone;
      state.clientName = req.customerName;
      state.view = 'cuenta';
      if(req.status === 'aceptada'){
        state.modal = {type:'completeRequest', requestId:req.id, mode:'contado', error:'', method:'transferencia', receiptImage:'', anticipo:null};
      }
    }
    return;
  }

  const mPago = hash.match(/#pago=([^&]+)/);
  if(mPago){
    const pr = state.abonoRequests.find(r=>r.id===decodeURIComponent(mPago[1]));
    if(pr){
      state.view = 'admin';
      state.adminTab = 'solicitudes';
      state.deepLinkPaymentId = pr.id;
    }
  }
}

(async function init(){
  render();
  const { data: { session } } = await sb.auth.getSession();
  if(session) state.adminAuthed = true;
  await loadAll();
  // Restaura la sesión de Mi Cuenta si la clienta ya había entrado antes en este dispositivo.
  const savedClient = loadClientSession();
  if(savedClient && savedClient.phone){
    state.clientPhone = savedClient.phone;
    state.clientName = savedClient.name || '';
  }
  handleDeepLink();
  render();
  if(state.loadErrorDetail && state.adminAuthed){
    notify('Algunos datos no se pudieron cargar. Detalle técnico: ' + state.loadErrorDetail);
  }
})();
</script>
