<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NONNA · Joyas & Accesorios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F8F4ED;
    --cream-2:#EFE8DB;
    --ink:#18140F;
    --gold:#A6813F;
    --gold-light:#C7A365;
    --stone:#7C7266;
    --line:#E7E0D2;
    --rose:#F1E8DB;
    --danger:#8C3B3B;
    --success:#3F5A40;
    --radius:3px;
    --shadow-sm:0 1px 2px rgba(24,20,15,.05);
    --shadow-md:0 14px 34px rgba(24,20,15,.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;}
  body{min-height:100vh;padding-left:64px;transition:padding-left .28s ease;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  body.rail-expanded{padding-left:230px;}
  .app{max-width:1180px;margin:0 auto;padding:0 24px 90px;}
  h1,h2,h3,.display{font-family:'Playfair Display',serif;font-weight:600;letter-spacing:.005em;line-height:1.2;}
  h4{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--stone);margin:0 0 14px;}
  .eyebrow{font-family:'Inter',sans-serif;font-weight:500;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--stone);}
  p{line-height:1.55;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;background:transparent;}
  ::selection{background:var(--gold-light);color:var(--ink);}

  /* ---------- Header ---------- */
  header{padding:40px 0 30px;text-align:center;position:relative;}
  .logo-wrap img{max-width:320px;width:64%;height:auto;display:inline-block;cursor:pointer;}
  .tagline{margin-top:6px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);min-height:14px;}

  main{padding-top:8px;}

  /* ---------- Left navigation rail: circles only, Catálogo expands in place ---------- */
  .rail{position:fixed;top:0;left:0;bottom:0;width:64px;background:var(--ink);z-index:70;overflow-x:hidden;overflow-y:auto;transition:width .28s cubic-bezier(.4,0,.2,1);padding:22px 0;display:flex;flex-direction:column;gap:16px;}
  .rail.expanded{width:230px;}
  .rail-circle-btn{width:64px;flex-shrink:0;background:none;border:none;display:flex;align-items:center;justify-content:center;padding:0;}
  .rail-circle{width:36px;height:36px;border-radius:50%;border:1px solid rgba(248,244,237,.28);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:15px;color:var(--cream);opacity:.8;transition:opacity .2s,border-color .2s,color .2s;}
  .rail-circle-btn:hover .rail-circle{opacity:1;border-color:var(--gold-light);}
  .rail-circle-btn.active .rail-circle{opacity:1;border-color:var(--gold-light);color:var(--gold-light);background:rgba(199,163,101,.08);}
  .rail-cat-list{display:flex;flex-direction:column;width:100%;margin-top:-6px;}
  .rail-cat-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;background:none;border:none;color:var(--cream);opacity:.72;padding:9px 18px 9px 62px;font-size:13.5px;text-align:left;line-height:1.3;transition:background .15s,opacity .15s;}
  .rail-cat-item:hover{background:rgba(248,244,237,.06);opacity:1;}
  .rail-cat-item.active{background:rgba(248,244,237,.09);opacity:1;color:var(--gold-light);}
  .rail-cat-item .count{font-size:10.5px;color:rgba(248,244,237,.5);}
  .rail-cat-item.active .count{color:rgba(199,163,101,.8);}

  @media (max-width:480px){
    body{padding-left:52px;}
    body.rail-expanded{padding-left:210px;}
    .rail{width:52px;}
    .rail.expanded{width:210px;}
    .rail-circle-btn{width:52px;}
    .rail-cat-item{padding-left:50px;}
  }

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 24px;font-size:13px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--ink);border-radius:var(--radius);background:transparent;color:var(--ink);transition:background .18s,color .18s,border-color .18s,transform .15s;}
  .btn:hover{background:var(--ink);color:var(--cream);}
  .btn:active{transform:translateY(1px);}
  .btn-gold{background:var(--ink);color:var(--cream);border-color:var(--ink);}
  .btn-gold:hover{background:var(--gold);border-color:var(--gold);color:#fff;}
  .btn-ghost{border-color:var(--line);color:var(--stone);}
  .btn-ghost:hover{background:var(--ink);color:var(--cream);border-color:var(--ink);}
  .btn-danger{border-color:var(--danger);color:var(--danger);}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .btn-sm{padding:8px 16px;font-size:11.5px;}
  .btn[disabled]{opacity:.35;cursor:not-allowed;pointer-events:none;}
  .link-btn{background:none;border:none;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line);color:var(--stone);font-size:13.5px;padding:0;transition:color .15s;}
  .link-btn:hover{color:var(--ink);text-decoration-color:var(--gold);}

  /* ---------- Inputs ---------- */
  .field{margin-bottom:16px;text-align:left;}
  .field label{display:block;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);margin-bottom:7px;}
  .field input, .field select, .field textarea{width:100%;border:none;border-bottom:1px solid var(--line);padding:9px 2px;font-size:15.5px;color:var(--ink);outline:none;transition:border-color .15s;}
  .field input:focus, .field select:focus, .field textarea:focus{border-bottom-color:var(--gold);}
  .field-row{display:flex;gap:18px;flex-wrap:wrap;}
  .field-row .field{flex:1;min-width:140px;}

  /* ---------- Catalog ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:30px;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{border:1px solid var(--line);padding:7px 15px;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;border-radius:20px;color:var(--stone);background:#fff;transition:background .15s,color .15s,border-color .15s;}
  .chip.active{background:var(--ink);color:var(--cream);border-color:var(--ink);}
  .search input{border:1px solid var(--line);padding:9px 16px;font-size:14px;min-width:220px;border-radius:20px;background:#fff;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px;}
  .card{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:0 0 16px;box-shadow:var(--shadow-sm);transition:box-shadow .2s,border-color .2s,transform .2s;}
  .card:hover{border-color:var(--gold-light);box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .card-media{aspect-ratio:1/1;background:linear-gradient(150deg,var(--rose),var(--cream-2));display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;border-radius:var(--radius) var(--radius) 0 0;}
  .card-media img{width:100%;height:100%;object-fit:cover;}
  .card-media .mono{font-family:'Playfair Display',serif;font-size:42px;color:var(--gold);}
  .card-body{padding:16px 16px 0;}
  .card-cat{font-size:10.5px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--stone);}
  .card-name{font-size:18px;margin:5px 0 6px;line-height:1.3;}
  .card-price{font-family:'Playfair Display',serif;font-size:18px;color:var(--gold);}
  .card-price-old{font-family:'Inter',sans-serif;font-size:13px;color:var(--stone);text-decoration:line-through;margin-left:6px;}
  .offer-badge{position:absolute;top:10px;left:10px;z-index:2;background:var(--danger);color:#fff;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:20px;}
  .card-stock{font-size:12px;color:var(--stone);margin-top:3px;}
  .card-stock.low{color:var(--danger);}
  .card-actions{padding:14px 16px 0;}
  .card-actions .btn{width:100%;}

  .empty{border:1px dashed var(--line);border-radius:var(--radius);padding:52px 24px;text-align:center;color:var(--stone);background:rgba(255,255,255,.4);}
  .empty .display{color:var(--ink);margin-bottom:8px;}

  /* ---------- Cart drawer ---------- */
  .cart-fab{position:fixed;bottom:28px;right:28px;background:var(--ink);color:var(--cream);border:none;border-radius:40px;padding:14px 24px;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;box-shadow:var(--shadow-md);z-index:40;transition:transform .15s;}
  .cart-fab:hover{transform:translateY(-2px);}
  .cart-fab .count{background:var(--gold);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;margin-left:8px;}
  .overlay{position:fixed;inset:0;background:rgba(24,20,15,.4);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(1px);}
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,92vw);background:var(--cream);z-index:60;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:-16px 0 40px rgba(0,0,0,.12);display:flex;flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .drawer-close{background:none;border:none;font-size:20px;color:var(--stone);}
  .drawer-body{padding:20px 24px;overflow-y:auto;flex:1;}
  .drawer-foot{padding:22px 24px;border-top:1px solid var(--line);}
  .cart-item{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);}
  .cart-item .ci-name{font-size:15px;flex:1;}
  .cart-item .ci-price{font-size:12.5px;color:var(--stone);}
  .qty-ctrl{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius);}
  .qty-ctrl button{background:none;border:none;width:26px;height:26px;font-size:14px;}
  .qty-ctrl span{width:24px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;}
  .row-between{display:flex;justify-content:space-between;align-items:center;}
  .total-line{font-family:'Playfair Display',serif;font-size:21px;margin:14px 0;font-variant-numeric:tabular-nums;}

  /* ---------- Account ---------- */
  .login-box{max-width:360px;margin:44px auto;text-align:center;border:1px solid var(--line);border-radius:var(--radius);padding:36px 30px;background:#fff;box-shadow:var(--shadow-sm);}
  .sale-card{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
  .highlight-pay{border-color:var(--gold);box-shadow:0 0 0 3px rgba(166,129,63,.22),var(--shadow-md);}
  .sale-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .sale-folio{font-size:11.5px;font-weight:500;letter-spacing:.1em;color:var(--stone);text-transform:uppercase;}
  .badge{font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:4px 11px;border-radius:20px;white-space:nowrap;}
  .badge.pendiente{background:var(--rose);color:var(--danger);}
  .badge.liquidada{background:#E4EAE1;color:var(--success);}
  .sale-items{font-size:14.5px;color:var(--stone);margin:6px 0 12px;line-height:1.6;}
  .bar-wrap{position:relative;height:5px;background:var(--line);border-radius:4px;margin:14px 0 8px;}
  .bar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:4px;}
  .bar-clasp{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--cream);transform:translate(-50%,-50%);}
  .sale-nums{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--stone);}
  .sale-nums b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}

  /* ---------- Admin ---------- */
  table{width:100%;border-collapse:collapse;background:#fff;font-variant-numeric:tabular-nums;}
  th,td{text-align:left;padding:13px 16px;font-size:14px;border-bottom:1px solid var(--line);}
  th{font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--stone);background:var(--cream-2);}
  tr.clickable{cursor:pointer;transition:background .12s;}
  tr.clickable:hover{background:var(--cream-2);}
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
  .panel{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:28px;margin-bottom:26px;box-shadow:var(--shadow-sm);}
  .admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;}
  .admin-tabs button{background:none;border:1px solid transparent;padding:9px 16px;border-radius:20px;font-size:12.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--stone);transition:background .15s,color .15s,border-color .15s;}
  .admin-tabs button:hover{border-color:var(--line);}
  .admin-tabs button.active{color:var(--ink);background:var(--rose);border-color:var(--rose);}
  .panel h3{margin:0 0 20px;}
  .img-upload-row{display:flex;gap:16px;align-items:center;}
  .lote-item-box{border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 8px;margin-bottom:14px;background:var(--cream-2);}
  .img-preview{width:84px;height:84px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
  .img-preview img{width:100%;height:100%;object-fit:cover;}
  .img-preview-zoomable{cursor:zoom-in;transition:transform .15s ease;}
  .img-preview-zoomable:hover{transform:scale(1.6);}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(24,20,15,.45);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px;backdrop-filter:blur(2px);}
  .modal{background:var(--cream);max-width:480px;width:100%;max-height:88vh;overflow-y:auto;padding:32px 30px;position:relative;border-radius:var(--radius);box-shadow:0 24px 60px rgba(0,0,0,.25);}
  .modal-close{position:absolute;top:16px;right:18px;background:none;border:none;font-size:20px;color:var(--stone);}
  .ticket-box{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;font-family:'Inter',sans-serif;font-size:14px;white-space:pre-wrap;line-height:1.65;margin:16px 0;font-variant-numeric:tabular-nums;}
  .pay-info{border:1px solid var(--line);border-radius:var(--radius);background:var(--cream-2);padding:18px 20px;margin:16px 0;}
  .pay-info-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);}
  .pay-info-row:first-of-type{border-top:none;padding-top:2px;}
  .pay-info-label{font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--stone);}
  .pay-info-value{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px;}

  .muted{color:var(--stone);font-size:13.5px;}
  .stack{display:flex;flex-direction:column;gap:12px;}
  footer.note{text-align:center;color:var(--stone);font-size:12px;margin-top:64px;letter-spacing:.02em;}

  @media (max-width:640px){
    nav.tabs{gap:20px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px;}
    .toolbar{flex-direction:column;align-items:stretch;}
    .panel{padding:20px;}
  }
</style>
</head>
<body>
<div class="rail" id="rail">
  <button class="rail-circle-btn" id="railCatBtn" data-nav-circle="catalogo" title="Catálogo">
    <span class="rail-circle">C</span>
  </button>
  <div class="rail-cat-list" id="railCatList"></div>
  <button class="rail-circle-btn" id="railCuentaBtn" data-nav-circle="cuenta" title="Mi Cuenta">
    <span class="rail-circle">M</span>
  </button>
  <button class="rail-circle-btn" id="railAdminBtn" data-nav-circle="admin" title="Admin">
    <span class="rail-circle">A</span>
  </button>
</div>

function readCategoryField(idPrefix){
  const sel = document.getElementById(idPrefix+'_select');
  const other = document.getElementById(idPrefix+'_other');
  if(!sel) return '';
  if(sel.value === 'Otro'){
    const t = other ? other.value.trim() : '';
    return t || 'Otro';
  }
  if(sel.value === '' && other && other.value.trim()){
    return other.value.trim(); // categoría heredada que no está en la lista fija
  }
  return sel.value;
}

function money(n){ return '$' + (Number(n)||0).toLocaleString('es-MX',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fdate(iso){ try{ return new Date(iso).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return iso;} }
// Fecha (YYYY-MM-DD) en horario local, no UTC — evita que una venta hecha por la tarde/noche
// quede registrada bajo el día siguiente al comparar contra un rango de fechas elegido.
function localDateStr(iso){
  try{
    const d = new Date(iso);
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }catch(e){ return String(iso).slice(0,10); }
}

// Rangos rápidos para el reporte de ganancias: hoy, esta semana (lun–dom), este mes, este año.
function quickRange(period){
  const now = new Date();
  let start, end;
  if(period === 'dia'){
    start = now; end = now;
  } else if(period === 'semana'){
    const day = now.getDay(); // 0=domingo … 6=sábado
    const diffToMonday = (day === 0) ? -6 : 1 - day;
    start = new Date(now); start.setDate(now.getDate() + diffToMonday);
    end = new Date(start); end.setDate(start.getDate() + 6);
  } else if(period === 'mes'){
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    end = new Date(now.getFullYear(), now.getMonth()+1, 0);
  } else { // 'anio'
    start = new Date(now.getFullYear(), 0, 1);
    end = new Date(now.getFullYear(), 11, 31);
  }
  return {start: localDateStr(start), end: localDateStr(end)};
}
function genId(prefix){ return prefix + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,5).toUpperCase(); }

function customerTotal(phone){ return customerSales(phone).reduce((s,x)=>s+Number(x.total||0),0); }
function customerAbonado(phone){ return customerPayments(phone).reduce((s,p)=>s+Number(p.amount||0),0); }
function customerSaldo(phone){ return Math.max(0, customerTotal(phone) - customerAbonado(phone)); }

// Ciclo vigente: solo las compras/abonos desde la última vez que la cuenta quedó en $0.
// El historial completo de la clienta nunca se borra (Admin → Cuentas lo sigue mostrando
// entero); esto es únicamente para no reenviarle por WhatsApp compras que ya liquidó.
function customerCurrentCycle(phone){
  const events = [];
  customerSales(phone).forEach(s => events.push({date:s.date, delta:s.total, type:'sale', ref:s}));
  customerPayments(phone).forEach(p => events.push({date:p.date, delta:-p.amount, type:'payment', ref:p}));
  events.sort((a,b)=> new Date(a.date) - new Date(b.date));
  let running = 0;
  let cutoffIndex = -1; // último evento que dejó el saldo exactamente en $0
  events.forEach((e,i) => {
    running += e.delta;
    if(Math.abs(running) < 0.005) cutoffIndex = i;
  });
  const current = events.slice(cutoffIndex+1);
  return {
    sales: current.filter(e=>e.type==='sale').map(e=>e.ref),
    payments: current.filter(e=>e.type==='payment').map(e=>e.ref),
  };
}

// Trazabilidad de inventario: cada artículo guarda su existencia repartida por lote de proveedor.
function productStock(p){ return (p.stockEntries||[]).reduce((s,e)=>s+e.qty,0); }
// Precio que realmente paga la clienta: el de oferta si el artículo está marcado en oferta.
function effectivePrice(p){ return (p.onSale && p.salePrice != null && p.salePrice > 0) ? p.salePrice : p.price; }
function consumeStock(product, qty){
  // Descuenta existencia siguiendo el orden en que se recibieron los lotes (FIFO)
  // y regresa de qué lote(s) salieron las piezas, para trazabilidad.
  let remaining = qty;
  const consumed = [];
  product.stockEntries = product.stockEntries || [];
  for(const entry of product.stockEntries){
    if(remaining <= 0) break;
    const take = Math.min(entry.qty, remaining);
    if(take > 0){
      consumed.push({loteId: entry.loteId, qty: take});
      entry.qty -= take;
      remaining -= take;
    }
  }
  product.stockEntries = product.stockEntries.filter(e => e.qty > 0);
  return consumed;
}

// Cuánto se ha vendido / devuelto de una recepción en particular, para trazabilidad.
function loteSoldQty(loteId, productId){
  let sold = 0;
  state.sales.forEach(s => s.items.forEach(i => {
    if(i.productId === productId){
      (i.loteBreakdown||[]).forEach(lb => { if(lb.loteId === loteId) sold += lb.qty; });
    }
  }));
  return sold;
}
function loteReturnedQty(loteId, productId){
  return state.returns.filter(r => r.loteId === loteId && r.productId === productId).reduce((s,r)=>s+r.qty, 0);
}
function loteReturnsCaused(loteId){
  return state.returns.filter(r => r.newLoteId === loteId);
}

// Cada recepción tiene un periodo de fechas que tú defines (por ejemplo del 1 al 15, o según
// las fechas que maneje tu proveedor), no una fecha única.
function loteDateRange(l){
  const end = l.endDate || l.date;
  return (end && end !== l.date) ? (fdate(l.date) + ' – ' + fdate(end)) : fdate(l.date);
}

// Recepciones cuyo periodo aún no termina (hoy es antes o igual a la fecha final que capturaste),
// a las que se les puede seguir agregando artículos sin cerrar la existencia de recepciones anteriores.
function eligibleContinuationLotes(){
  const today = new Date().toISOString().slice(0,10);
  return state.lotes
    .filter(l => (l.endDate || l.date) >= today)
    .sort((a,b)=> new Date(b.date)-new Date(a.date));
}

// Cuánto se vendió (a precio de venta) de una recepción en particular.
function loteRevenue(loteId){
  let revenue = 0;
  state.sales.forEach(s => s.items.forEach(i => {
    (i.loteBreakdown||[]).forEach(lb => { if(lb.loteId === loteId) revenue += lb.qty * i.price; });
  }));
  return revenue;
}

// Porcentaje de ganancia según el total vendido en el periodo:
// hasta $1,000 → 35% · más de $1,000 → 40% · más de $2,000 → 45% · más de $3,000 → 50%.
function profitTierPct(total){
  if(total > 3000) return 0.50;
  if(total > 2000) return 0.45;
  if(total > 1000) return 0.40;
  return 0.35;
}
function loteReport(loteId){
  const total = loteRevenue(loteId);
  const pct = profitTierPct(total);
  const ganancia = total * pct;
  const proveedor = total - ganancia;
  return {total, pct, ganancia, proveedor};
}

// Reportes de ganancia: cada recepción ya trae su propia ganancia calculada (según su propio
// porcentaje por tramo). Estos reportes SUMAN esas ganancias ya calculadas — no vuelven a
// aplicar un porcentaje sobre el total combinado de varias recepciones.
function allLotesReport(){
  const rows = [...state.lotes]
    .map(l => ({l, report: loteReport(l.id)}))
    .sort((a,b)=> new Date(a.date) - new Date(b.date));
  return {
    rows,
    total: rows.reduce((s,r)=>s+r.report.total,0),
    ganancia: rows.reduce((s,r)=>s+r.report.ganancia,0),
    proveedor: rows.reduce((s,r)=>s+r.report.proveedor,0),
  };
}
// Cuánto se vendió (a precio de venta) de una recepción, pero solo dentro de un rango de
// fechas — para los periodos rápidos (hoy, semana, mes, año), que deben reflejar SOLO las
// ventas hechas en esas fechas, no el total completo de la recepción a la que pertenecen.
function loteRevenueInDateRange(loteId, start, end){
  let revenue = 0;
  state.sales.forEach(s => {
    const d = localDateStr(s.date);
    if(d < start || d > end) return;
    s.items.forEach(i => {
      (i.loteBreakdown||[]).forEach(lb => { if(lb.loteId === loteId) revenue += lb.qty * i.price; });
    });
  });
  return revenue;
}
// El % aplicado sigue siendo el de la recepción completa (según su propio total vendido),
// pero se aplica solo sobre lo que realmente se vendió dentro del rango de fechas elegido.
function periodSalesReport(start, end){
  const rows = [];
  state.lotes.forEach(l => {
    const total = loteRevenueInDateRange(l.id, start, end);
    if(total > 0){
      const pct = loteReport(l.id).pct;
      const ganancia = total * pct;
      const proveedor = total - ganancia;
      rows.push({l, report:{total, pct, ganancia, proveedor}});
    }
  });
  rows.sort((a,b)=> new Date(a.l.date) - new Date(b.l.date));
  return {
    rows,
    total: rows.reduce((s,r)=>s+r.report.total,0),
    ganancia: rows.reduce((s,r)=>s+r.report.ganancia,0),
    proveedor: rows.reduce((s,r)=>s+r.report.proveedor,0),
  };
}

// Al registrar una nueva recepción, la mercancía no vendida de recepciones anteriores se
// entrega de vuelta al proveedor para su cambio, así que deja de estar disponible para la venta.
function closeOutPreviousStock(newLoteId, date){
  state.products.forEach(p => {
    (p.stockEntries||[]).forEach(entry => {
      if(entry.qty > 0 && entry.loteId !== newLoteId){
        state.returns.push({
          id: genId('DEV'),
          loteId: entry.loteId,
          productId: p.id,
          productName: p.name,
          qty: entry.qty,
          date,
          newLoteId,
        });
        entry.qty = 0;
      }
    });
  });
}

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Sube una imagen (en base64) a Supabase Storage y regresa su URL pública.
// Si lo que recibe ya es una URL (no una imagen nueva), la deja igual —
// evita volver a subir una foto que no cambió.
async function uploadDataUrlToStorage(dataUrl, bucket, folder){
  if(!dataUrl || !dataUrl.startsWith('data:')) return dataUrl || '';
  try{
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const ext = (blob.type.split('/')[1] || 'jpg').split('+')[0];
    const path = folder + '/' + genId('IMG') + '.' + ext;
    const { error } = await sb.storage.from(bucket).upload(path, blob, {contentType: blob.type, upsert: true});
    if(error) throw error;
    const { data } = sb.storage.from(bucket).getPublicUrl(path);
    return data.publicUrl;
  }catch(err){
    console.error('Error subiendo imagen a Storage', err);
    return dataUrl; // respaldo: no perder la imagen si falla la subida
  }
}

/* ================= STORAGE ================= */
// Compatibilidad: normaliza solicitudes guardadas con el formato anterior (un solo artículo,
// sin lista "items" ni "total"), para que el resto de la app siempre pueda asumir el formato
// nuevo (varios artículos por solicitud) sin importar cuándo se creó el registro.
function normalizeRequest(r){
  if(!r.items){
    r.items = r.productId ? [{productId:r.productId, name:r.productName||'Artículo', price:r.price||0, qty:1}] : [];
  }
  if(r.total == null){
    r.total = r.items.reduce((s,it)=>s+(Number(it.price)||0)*(Number(it.qty)||0), 0);
  }
  return r;
}

// Compatibilidad: solicitudes de abono guardadas antes de agregar método de pago / comprobante.
function normalizePaymentRequest(pr){
  if(!pr.type) pr.type = 'abono';
  if(!pr.method) pr.method = 'efectivo';
  if(pr.receiptImage == null) pr.receiptImage = '';
  return pr;
}

/* ================= CARGA Y GUARDADO (Supabase) ================= */
async function loadAll(){
  const loadErrors = [];
  try{
    const named = {
      products: sb.from('products').select('*'),
      sales: sb.from('sales').select('*'),
      customers: sb.from('customers').select('phone,name'),
      payments: sb.from('payments').select('*'),
      lotes: sb.from('lotes').select('*'),
      returns: sb.from('returns').select('*'),
      requests: sb.from('requests').select('*'),
      payment_requests: sb.from('payment_requests').select('*'),
      settings: sb.from('settings').select('*').eq('id','default').maybeSingle(),
    };
    const keys = Object.keys(named);
    const results = await Promise.all(keys.map(k => named[k]));
    const [productsRes, salesRes, customersRes, paymentsRes, lotesRes, returnsRes, requestsRes, prRes, settingsRes] = results;
    keys.forEach((k, i) => { if(results[i].error) loadErrors.push(k + ': ' + results[i].error.message); });

    state.products = (productsRes.data||[]).map(dbToProduct);
    state.sales = (salesRes.data||[]).map(dbToSale);
    state.customers = (customersRes.data||[]).map(dbToCustomer);
    state.payments = (paymentsRes.data||[]).map(dbToPayment);
    state.lotes = (lotesRes.data||[]).map(dbToLote);
    state.returns = (returnsRes.data||[]).map(dbToReturn);
    state.requests = (requestsRes.data||[]).map(dbToRequest).map(normalizeRequest);
    state.abonoRequests = (prRes.data||[]).map(dbToPaymentRequest).map(normalizePaymentRequest);
    state.settings = settingsRes.data ? dbToSettings(settingsRes.data) : {whatsappNumber:'', paymentInfo:{bankName:'',accountHolder:'',accountNumber:'',cardNumber:''}};
  }catch(err){
    console.error('Error cargando datos de Supabase', err);
    loadErrors.push(String(err && err.message || err));
  }
  state.loaded = true;
  if(loadErrors.length){
    console.error('Errores al cargar datos:', loadErrors);
    state.loadErrorDetail = loadErrors.join(' | ');
  }
}

// Sincroniza una tabla completa con el array local: agrega/actualiza lo que hay,
// y borra en la base lo que ya no está en el array (para que eliminar en la app
// también elimine de verdad en Supabase).
let lastSaveError = '';
async function syncTable(table, idField, localRows, toDbFn){
  try{
    const { data: existing, error: selErr } = await sb.from(table).select(idField);
    if(selErr) throw selErr;
    const existingIds = new Set((existing||[]).map(r=>r[idField]));
    const localIds = new Set(localRows.map(r=>r[idField]));
    const toDelete = [...existingIds].filter(id => !localIds.has(id));
    if(toDelete.length){
      const { error: delErr } = await sb.from(table).delete().in(idField, toDelete);
      if(delErr) throw delErr;
    }
    if(localRows.length){
      const rows = localRows.map(toDbFn);
      const { error: upErr } = await sb.from(table).upsert(rows, {onConflict:idField});
      if(upErr) throw upErr;
    }
    return true;
  }catch(err){
    console.error('Error guardando en ' + table, err);
    const detail = (err && (err.message || err.details || err.hint || err.code)) || 'error desconocido';
    lastSaveError = table + ': ' + detail;
    return false;
  }
}
// Inserta o actualiza UNA sola fila (a diferencia de syncTable, que reenvía la tabla completa).
// Se usa en las acciones de clientas sin sesión, para que su acción nunca dependa de — ni
// pueda verse bloqueada por — el estado de registros de otras personas.
async function insertRow(table, toDbFn, row){
  try{
    const { error } = await sb.from(table).insert(toDbFn(row));
    if(error) throw error;
    return true;
  }catch(err){
    console.error('Error insertando en ' + table, err);
    lastSaveError = table + ': ' + ((err && (err.message || err.details || err.hint || err.code)) || 'error desconocido');
    return false;
  }
}
async function updateRowFields(table, idField, idValue, fields){
  try{
    const { error } = await sb.from(table).update(fields).eq(idField, idValue);
    if(error) throw error;
    return true;
  }catch(err){
    console.error('Error actualizando en ' + table, err);
    lastSaveError = table + ': ' + ((err && (err.message || err.details || err.hint || err.code)) || 'error desconocido');
    return false;
  }
}
// Borra únicamente las filas indicadas (por su id), sin tocar el resto de la tabla.
async function deleteRows(table, idField, ids){
  if(!ids.length) return true;
  try{
    const { error } = await sb.from(table).delete().in(idField, ids);
    if(error) throw error;
    return true;
  }catch(err){
    console.error('Error eliminando en ' + table, err);
    lastSaveError = table + ': ' + ((err && (err.message || err.details || err.hint || err.code)) || 'error desconocido');
    return false;
  }
}

function buildTicket(sale){
  const lines = [];
  lines.push('NONNA · Joyas & Accesorios');
  lines.push('Ticket de compra');
  lines.push('Compra: ' + sale.id);
  lines.push('Cliente: ' + sale.customerName);
  lines.push('Fecha: ' + fdate(sale.date));
  lines.push('－－－－－－－－－－－－');
  sale.items.forEach(it => lines.push(it.qty + ' x ' + it.name + '   ' + money(it.price*it.qty)));
  lines.push('－－－－－－－－－－－－');
  lines.push('Total de esta compra: ' + money(sale.total));
  lines.push('Saldo total de su cuenta: ' + money(customerSaldo(sale.customerPhone)));
  lines.push('');
  lines.push('¡Gracias por tu compra! — NONNA Joyas & Accesorios');
  return lines.join('\n');
}

function buildAccountStatement(phone){
  const c = state.customers.find(x=>x.phone===phone);
  const cycle = customerCurrentCycle(phone);
  const sales = [...cycle.sales].sort((a,b)=> new Date(a.date)-new Date(b.date));
  const payments = [...cycle.payments].sort((a,b)=> new Date(a.date)-new Date(b.date));
  const cycleTotal = sales.reduce((s,x)=>s+x.total,0);
  const cycleAbonado = payments.reduce((s,p)=>s+p.amount,0);
  const saldo = customerSaldo(phone); // coincide con cycleTotal - cycleAbonado
  const lines = [];
  lines.push('NONNA · Joyas & Accesorios');
  lines.push('Estado de cuenta');
  lines.push('Cliente: ' + (c ? c.name : ''));
  lines.push('Fecha: ' + fdate(new Date().toISOString()));
  lines.push('－－－－－－－－－－－－');
  lines.push('Compras:');
  if(sales.length){
    sales.forEach(s => lines.push('· ' + fdate(s.date) + '  Compra ' + s.id + '  ' + money(s.total)));
  } else {
    lines.push('· Sin compras pendientes');
  }
  lines.push('－－－－－－－－－－－－');
  lines.push('Abonos:');

// Copia al portapapeles con respaldo por si el navegador bloquea la API moderna.
function copyToClipboardBtn(btn, text){
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(fallback);
  } else {
    fallback();
  }
  const original = btn.textContent;
  btn.textContent = '¡Copiado!';
  setTimeout(()=>{ if(btn) btn.textContent = original; }, 1500);
}

/* ================= RENDER ROOT ================= */
function render(){
  // Antes de volver a dibujar, recuerda qué campo tenía el foco (y dónde estaba el cursor),
  // porque cada render reemplaza el HTML y por default el navegador pierde el foco —
  // eso era lo que hacía que los buscadores solo dejaran escribir una letra a la vez.
  const active = document.activeElement;
  const activeId = active && active.id;
  const activeStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const activeEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

  renderSidebar();
  applySeasonalTheme();
  const root = document.getElementById('view-root');
  if(!state.loaded){ root.innerHTML = '<p class="muted" style="text-align:center;padding:60px 0;">Cargando catálogo…</p>'; return; }
  if(state.view === 'catalogo') root.innerHTML = viewCatalogo();
  else if(state.view === 'cuenta') root.innerHTML = viewCuenta();
  else if(state.view === 'admin') root.innerHTML = viewAdmin();
  renderCartFab();
  renderDrawer();
  renderModal();
  bindEvents();

  if(activeId){
    const el = document.getElementById(activeId);
    if(el && typeof el.focus === 'function'){
      el.focus();
      if(activeStart != null && typeof el.setSelectionRange === 'function'){
        try{ el.setSelectionRange(activeStart, activeEnd); }catch(e){}
      }
    }
  }
}

/* ================= CATALOGO ================= */
function viewCatalogo(){
  const cats = ['Todas', 'Ofertas', ...Array.from(new Set(state.products.map(p=>p.category)))];
  let items = state.products.filter(p => {
    const matchesCat = state.category==='Todas' || (state.category==='Ofertas' ? p.onSale : p.category===state.category);
    return matchesCat && p.name.toLowerCase().includes(state.search.toLowerCase());
  });

  const chips = cats.map(c => `<button class="chip ${state.category===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');

  if(state.products.length === 0){
    return `<div class="empty"><div class="display">Aún no hay artículos</div><p>Se agregan desde Admin → Recepciones, al registrar la primera recepción de mercancía.</p></div>`;
  }

  const cards = items.map(p => {
    const inCart = state.cart.find(c=>c.productId===p.id);
    const available = productStock(p) - (inCart?inCart.qty:0);
    const media = p.image
      ? `<img src="${esc(p.image)}" alt="${esc(p.name)}">`
      : `<span class="mono">${esc(p.name.slice(0,1))}</span>`;
    const onOffer = p.onSale && p.salePrice != null && p.salePrice > 0 && p.salePrice < p.price;
    const priceHtml = onOffer
      ? `<div class="card-price">${money(p.salePrice)} <span class="card-price-old">${money(p.price)}</span></div>`
      : `<div class="card-price">${money(p.price)}</div>`;
    return `
    <div class="card">
      ${onOffer ? `<span class="offer-badge">Oferta</span>` : ''}
      <div class="card-media">${media}</div>
      <div class="card-body">
        <div class="card-cat">${esc(p.category)}</div>
        <div class="card-name display">${esc(p.name)}</div>
        ${priceHtml}
        <div class="card-stock ${available<=2?'low':''}">${available>0 ? available+' disponibles' : 'Agotado'}</div>
      </div>
      <div class="card-actions">
        <button class="btn ${available<=0?'':'btn-gold'}" data-add="${p.id}" ${available<=0?'disabled':''}>${available<=0?'Agotado':'Lo quiero'}</button>
      </div>
    </div>`;
  }).join('');

  return `
    <div class="toolbar">
      <div class="chips">${chips}</div>
      <div class="search"><input type="text" id="searchInput" placeholder="Buscar artículo…" value="${esc(state.search)}"></div>
    </div>
    ${items.length ? `<div class="grid">${cards}</div>` : `<div class="empty"><div class="display">Sin resultados</div><p>Prueba con otra categoría o búsqueda.</p></div>`}
  `;
}

        ${productStock(p)>0 ? `<button class="btn btn-sm btn-ghost" data-mark-sold="${p.id}">Vendido en tienda</button>` : ''}
        <button class="btn btn-sm btn-ghost" data-trace-product="${p.id}">Trazabilidad</button>
        <button class="btn btn-sm btn-ghost" data-edit-product="${p.id}">Editar</button>
        <button class="btn btn-sm btn-danger" data-del-product="${p.id}">Eliminar</button>
      </td>
    </tr>`;
  }).join('');

  return `
    <div class="row-between" style="margin-bottom:16px;">
      <h3 class="display" style="margin:0;">Artículos (${state.products.length})</h3>
    </div>
    ${form}
    ${state.products.length ? `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Foto</th><th>Artículo</th><th>Categoría</th><th>Precio</th><th>Existencia</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>` : `<div class="empty"><div class="display">Sin artículos</div><p>Los artículos se dan de alta desde una recepción de mercancía, en la pestaña <b>Recepciones</b>.</p></div>`}
    <p class="muted" style="margin-top:16px;">Los artículos nuevos se dan de alta y se surten desde la pestaña <b>Recepciones</b>; aquí puedes editar su información, foto o eliminarlos.</p>
  `;
}

function productTrace(p){
  const entries = (p.stockEntries||[]).map(e => {
    const l = state.lotes.find(x=>x.id===e.loteId);
    return `<tr><td>${l?loteDateRange(l):'—'}</td><td>${l?esc(l.provider):'Sin recepción registrada'}</td><td>${e.qty}</td></tr>`;
  }).join('');

  const usageRows = [];
  state.sales.forEach(s => {
    s.items.forEach(i => {
      if(i.productId === p.id){
        (i.loteBreakdown||[]).forEach(lb => {
          const l = state.lotes.find(x=>x.id===lb.loteId);
          usageRows.push(`<tr><td>${esc(s.id)}</td><td>${esc(s.customerName)}</td><td>${fdate(s.date)}</td><td>${lb.qty}</td><td>${l?(esc(l.provider)+' · '+loteDateRange(l)):'—'}</td></tr>`);
        });
      }
    });
  });

  return `
    <button class="link-btn" id="backToInventario" style="margin-bottom:18px;">&larr; Volver a inventario</button>
    <div class="panel">
      <h3 style="margin:0 0 4px;">${esc(p.name)}</h3>
      <p class="muted">${esc(p.sku)} · Existencia actual: ${productStock(p)}</p>

      <h4 style="margin-top:18px;">Existencia por recepción de proveedor</h4>
      ${entries ? `<div class="table-wrap"><table>
        <thead><tr><th>Periodo de recepción</th><th>Proveedor</th><th>Cantidad disponible</th></tr></thead>
        <tbody>${entries}</tbody>
      </table></div>` : `<p class="muted">Sin existencia registrada.</p>`}

      <h4 style="margin-top:22px;">Compras de este artículo</h4>
      ${usageRows.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Compra</th><th>Clienta</th><th>Fecha</th><th>Cant.</th><th>Recepción de origen</th></tr></thead>
        <tbody>${usageRows.join('')}</tbody>
      </table></div>` : `<p class="muted">Aún no se ha vendido este artículo.</p>`}
    </div>
  `;
}

    </div>
    <div class="field-row">

    <div class="field"><label>Precio de oferta (MXN)</label><input id="pf_sale_price" type="number" min="0" step="0.01" value="${esc(draft.salePrice)}" placeholder="Menor al precio normal"></div>
    <p class="muted" style="margin-top:-8px;">Se muestra en el catálogo con el precio normal tachado y una etiqueta de "Oferta"; también aparece en el filtro "Ofertas".</p>

    <p class="muted">Existencia actual: <b>${productStock(p)}</b> — se surte y se rastrea desde la pestaña Recepciones.</p>
    <div class="field">
      <label>Fotografía del artículo</label>
      <div class="img-upload-row">

        <div class="stack" style="gap:8px;">
          <input type="file" id="pf_image_file" accept="image/*">

      <button class="btn btn-gold" id="pf_save">Guardar</button>
      <button class="btn btn-ghost" id="pf_cancel">Cancelar</button>

}
// Antes de un cambio que vuelve a dibujar el formulario (oferta, imagen), guarda lo ya escrito.
function captureProductFormFields(){
  if(!state.productFormDraft) return;

  const skuEl = document.getElementById('pf_sku');
  const priceEl = document.getElementById('pf_price');

function adminLotes(){
  if(state.viewingLoteId){
    const l = state.lotes.find(x=>x.id===state.viewingLoteId);
    if(l) return loteDetail(l);
  }
  if(state.creatingLote) return loteForm();

  const eligibleIds = new Set(eligibleContinuationLotes().map(l=>l.id));
  const sorted = [...state.lotes].sort((a,b)=> new Date(b.date)-new Date(a.date));
  const rows = sorted.map(l => {
    const totalQty = l.items.reduce((s,i)=>s+i.qtyReceived,0);
    return `
    <tr class="clickable" data-view-lote="${esc(l.id)}">
      <td>${loteDateRange(l)}</td>
      <td>${esc(l.provider)}</td>
      <td>${esc(l.reference||'—')}</td>
      <td>${l.items.length} artículos · ${totalQty} pzas</td>
      <td>${eligibleIds.has(l.id) ? '<span class="badge pendiente">Periodo abierto</span>' : '<span class="badge liquidada">Periodo cerrado</span>'}</td>
    </tr>`;
  }).join('');

  return `
    <div class="row-between" style="margin-bottom:16px;">
      <h3 class="display" style="margin:0;">Recepciones de mercancía (${state.lotes.length})</h3>
      <button class="btn btn-gold btn-sm" id="newLoteBtn">Registrar recepción</button>
    </div>
    ${state.lotes.length ? `
    <div class="table-wrap"><table>
      <thead><tr><th>Periodo</th><th>Proveedor</th><th>Referencia</th><th>Contenido</th><th>Estado</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>` : `<div class="empty"><div class="display">Aún no hay recepciones registradas</div><p>Registra la próxima recepción de mercancía de tu proveedor para llevar trazabilidad de cada artículo.</p></div>`}
  `;
}

  const existingProduct = isExisting ? state.products.find(p=>p.id===row.existingProductId) : null;
  const existingOptions = [...state.products]
    .sort((a,b)=> a.name.localeCompare(b.name))
    .map(p => `<option value="${esc(p.id)}" ${row.existingProductId===p.id?'selected':''}>${esc(p.name)} — ${esc(p.category)} — ${money(p.price)}</option>`)

  return `
  <div class="lote-item-box" data-lote-row="${row.id}">
    <div class="field">

    <div class="field-row" style="align-items:flex-end;">
      <div class="field" style="flex:2;min-width:200px;"><label>Categoría</label>
        ${categoryFieldHtml('row_cat_'+row.id, row.category||'')}
      </div>
      <div class="field" style="flex:1;"><label>Precio (MXN)</label>
        <input type="number" min="0" step="0.01" data-row-price="${row.id}" placeholder="0.00" value="${esc(row.price||'')}">
      </div>
      <div class="field" style="flex:1;"><label>Cantidad recibida</label>
        <input type="number" min="1" step="1" data-row-qty="${row.id}" placeholder="0" value="${esc(row.qty||'')}">
      </div>
      <div class="field" style="flex:2;min-width:160px;"><label>Nombre o detalle</label>
        <input type="text" data-row-name="${row.id}" placeholder="Ej. arete mariposa" value="${esc(row.name||'')}">

      </div>
    </div>
    <div class="field" style="margin-top:2px;">
      <label>Fotografía</label>

        <div class="stack" style="gap:8px;">
          <input type="file" data-row-image-file="${row.id}" accept="image/*">

      </div>
    </div>
    <p class="muted">Se sumará existencia a "${existingProduct?esc(existingProduct.name):''}"${existingProduct?(' ('+money(existingProduct.price)+')'):''} — sin cambiar su foto ni sus datos.</p>
    `}

}

// Antes de volver a dibujar el formulario (al agregar/quitar un renglón), guarda en el
// estado lo que ya se había capturado en pantalla, para que no se pierda nada.
function captureLoteFormState(){
  if(!state.creatingLote) return;
  const startEl = document.getElementById('lf_period_start');
  const endEl = document.getElementById('lf_period_end');
  const provEl = document.getElementById('lf_provider');
  const refEl = document.getElementById('lf_reference');
  const notesEl = document.getElementById('lf_notes');
  const prevMeta = state.loteFormMeta || {};
  state.loteFormMeta = {
    periodStart: startEl ? startEl.value : prevMeta.periodStart,
    periodEnd: endEl ? endEl.value : prevMeta.periodEnd,
    provider: provEl ? provEl.value : prevMeta.provider,
    reference: refEl ? refEl.value : prevMeta.reference,
    notes: notesEl ? notesEl.value : prevMeta.notes,
  };
  state.loteFormRows = state.loteFormRows.map(row => {
    const priceEl = document.querySelector(`[data-row-price="${row.id}"]`);
    const qtyEl = document.querySelector(`[data-row-qty="${row.id}"]`);
    const nameEl = document.querySelector(`[data-row-name="${row.id}"]`);
    const category = readCategoryField('row_cat_'+row.id) || row.category || '';
    return {
      id: row.id,
      category,
      price: priceEl ? priceEl.value : row.price,
      qty: qtyEl ? qtyEl.value : row.qty,
      name: nameEl ? nameEl.value : row.name,
      image: row.image || '',
      existingProductId: row.existingProductId || null,
    };
  });
}

function loteForm(){
  const meta = state.loteFormMeta || {periodStart:'', periodEnd:'', provider:'', reference:'', notes:''};
  const rows = state.loteFormRows.map(loteItemRow).join('');
  const pendingStock = totalExistencia();
  const isContinuation = !!state.loteFormTargetId;
  const targetLote = isContinuation ? state.lotes.find(l=>l.id===state.loteFormTargetId) : null;
  const eligible = eligibleContinuationLotes();
  const targetOptions = eligible.map(l => `<option value="${esc(l.id)}" ${state.loteFormTargetId===l.id?'selected':''}>${loteDateRange(l)} · ${esc(l.provider)}</option>`).join('');

  return `
  <div class="panel">
    <h3>Registrar recepción de mercancía</h3>
    <div class="field">
      <label>¿Nueva recepción o continuación de una vigente?</label>
      <select id="lf_target">
        <option value="">Nueva recepción (cierra la existencia de recepciones anteriores)</option>
        ${targetOptions}
      </select>
      ${eligible.length===0 ? `<p class="muted" style="margin-top:6px;">No tienes recepciones con periodo vigente para continuar.</p>` : ''}
    </div>
    ${isContinuation
      ? `<p class="muted">Estás agregando artículos a la recepción del periodo ${targetLote ? loteDateRange(targetLote) : ''}. No se cerrará la existencia de recepciones anteriores.</p>`
      : (pendingStock > 0 ? `<p class="muted" style="color:var(--danger);">Al guardar, las ${pendingStock} piezas que aún tienes disponibles de recepciones anteriores dejarán de estar a la venta (se registran como devueltas al proveedor para su cambio).</p>` : '')}
    ${!isContinuation ? `
    <div class="field-row">
      <div class="field"><label>Periodo — del</label><input id="lf_period_start" type="date" value="${esc(meta.periodStart||'')}"></div>
      <div class="field"><label>al</label><input id="lf_period_end" type="date" value="${esc(meta.periodEnd||'')}"></div>
    </div>
    <p class="muted" style="margin-top:-8px;">Pon las fechas que correspondan a esta recepción según tu proveedor — por ejemplo del 1 al 15, del 16 al 31, o las que manejen entre ustedes.</p>
    ` : ''}
    <div class="field-row">
      <div class="field"><label>Proveedor</label><input id="lf_provider" placeholder="Nombre del proveedor" value="${esc(meta.provider||'')}"></div>
      <div class="field"><label>Referencia / factura (opcional)</label><input id="lf_reference" placeholder="Folio, factura…" value="${esc(meta.reference||'')}"></div>
    </div>
    <div class="field"><label>Notas (opcional)</label><input id="lf_notes" placeholder="Observaciones de la recepción" value="${esc(meta.notes||'')}"></div>
    <h4 style="margin-top:20px;">Artículos recibidos</h4>
    <p class="muted">Por default, cada artículo que agregues aquí se da de alta como una pieza nueva y distinta, con su propia foto. Si de verdad es una reposición exacta de algo que ya tienes en el catálogo, elígelo en "Artículo" para sumarle existencia en vez de crear otra entrada.</p>
    <div id="loteRows">${rows}</div>
    <button type="button" class="link-btn" id="lf_add_row" style="margin-top:6px;">+ Agregar artículo</button>
    <div style="display:flex;gap:10px;margin-top:22px;">
      <button class="btn btn-gold" id="lf_save">${isContinuation ? 'Agregar a la recepción' : 'Guardar recepción'}</button>
      <button class="btn btn-ghost" id="lf_cancel">Cancelar</button>
    </div>
  </div>`;
}

function loteDetail(l){
  const itemRows = l.items.map(it => {
    const p = state.products.find(pp=>pp.id===it.productId);
    const entry = p ? (p.stockEntries||[]).find(e=>e.loteId===l.id) : null;
    const remaining = entry ? entry.qty : 0;
    const sold = loteSoldQty(l.id, it.productId);
    const returned = loteReturnedQty(l.id, it.productId);
    return `<tr><td>${esc(it.name)}</td><td>${it.qtyReceived}</td><td>${sold}</td><td>${returned}</td><td>${remaining}</td></tr>`;
  }).join('');

  const usageRows = [];
  state.sales.forEach(s => {
    s.items.forEach(i => {
      (i.loteBreakdown||[]).forEach(lb => {
        if(lb.loteId === l.id){
          usageRows.push(`<tr><td>${esc(s.id)}</td><td>${esc(s.customerName)}</td><td>${fdate(s.date)}</td><td>${esc(i.name)}</td><td>${lb.qty}</td></tr>`);
        }
      });
    });
  });

  const returnsCaused = loteReturnsCaused(l.id);
  const report = loteReport(l.id);
  const today = new Date().toISOString().slice(0,10);
  const periodOpen = (l.endDate || l.date) >= today;

  return `
    <button class="link-btn" id="backToLotes" style="margin-bottom:18px;">&larr; Volver a recepciones</button>
    <div class="panel">
      <h3 style="margin:0 0 6px;">Recepción · ${loteDateRange(l)}</h3>
      <p class="muted">${esc(l.provider)}${l.reference?(' · Ref. '+esc(l.reference)):''} · <span class="badge ${periodOpen?'pendiente':'liquidada'}">${periodOpen?'Periodo abierto':'Periodo cerrado'}</span></p>
      ${l.notes ? `<p class="muted">${esc(l.notes)}</p>` : ''}

      <h4 style="margin-top:18px;">Artículos recibidos</h4>
      <div class="table-wrap"><table>
        <thead><tr><th>Artículo</th><th>Recibido</th><th>Vendido</th><th>Devuelto</th><th>Disponible</th></tr></thead>
        <tbody>${itemRows}</tbody>
      </table></div>

      ${returnsCaused.length ? `
      <h4 style="margin-top:22px;">Devoluciones generadas por esta recepción</h4>
      <p class="muted">Al registrar esta recepción, la mercancía sin vender de recepciones anteriores se marcó como devuelta al proveedor para su cambio.</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Artículo</th><th>Recepción de origen</th><th>Cantidad devuelta</th></tr></thead>
        <tbody>${returnsCaused.map(r=>{
          const origin = state.lotes.find(x=>x.id===r.loteId);
          return `<tr><td>${esc(r.productName)}</td><td>${origin?loteDateRange(origin):'—'}</td><td>${r.qty}</td></tr>`;
        }).join('')}</tbody>
      </table></div>` : ''}

      <h4 style="margin-top:22px;">Compras que han tomado de esta recepción</h4>
      ${usageRows.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Compra</th><th>Clienta</th><th>Fecha</th><th>Artículo</th><th>Cant.</th></tr></thead>
        <tbody>${usageRows.join('')}</tbody>
      </table></div>` : `<p class="muted">Aún no se ha vendido nada de esta recepción.</p>`}

      <h4 style="margin-top:22px;">Reporte de ganancia del periodo</h4>
      <p class="muted">Según lo vendido: hasta $1,000 → 35% ganancia · más de $1,000 → 40% · más de $2,000 → 45% · más de $3,000 → 50%. El resto es lo que corresponde al proveedor.</p>
      <div class="sale-nums" style="margin-top:6px;">
        <span>Total vendido <b>${money(report.total)}</b></span>
        <span>% de ganancia aplicado <b>${Math.round(report.pct*100)}%</b></span>
      </div>
      <div class="sale-nums" style="margin-top:8px;">
        <span>Tu ganancia <b>${money(report.ganancia)}</b></span>
        <span>Corresponde al proveedor <b>${money(report.proveedor)}</b></span>
      </div>

      <h4 style="margin-top:26px;">Zona de riesgo</h4>
      <p class="muted">Elimina esta recepción — se usa para corregir recepciones de prueba o dadas de alta por error. La existencia que quedaba sin vender de esta recepción se quita del inventario.</p>
      <button class="btn btn-danger btn-sm" data-delete-lote="${esc(l.id)}">Eliminar recepción</button>
    </div>
  `;
}

function adminVentas(){
  if(state.viewingSaleId){
    const s = state.sales.find(x=>x.id===state.viewingSaleId);
    if(s) return saleDetail(s);
  }
  const search = (state.ventasSearch||'').trim().toLowerCase();
  let filtered = [...state.sales].sort((a,b)=> new Date(b.date)-new Date(a.date));
  if(search){
    filtered = filtered.filter(s =>
      s.id.toLowerCase().includes(search) ||
      (s.customerName||'').toLowerCase().includes(search) ||
      (s.customerPhone||'').includes(search)
    );
  }

  const pageInfo = paginate(filtered, state.ventasPage);
  state.ventasPage = pageInfo.page;
  const rows = pageInfo.items.map(s => `
    <tr class="clickable" data-view-sale="${esc(s.id)}">
      <td>${esc(s.id)}</td>
      <td>${esc(s.customerName)}<div class="muted">${esc(s.customerPhone)}</div></td>
      <td>${fdate(s.date)}</td>
      <td>${money(s.total)}</td>
      <td>${money(customerSaldo(s.customerPhone))}</td>
    </tr>`).join('');

  return `
    <div class="row-between" style="margin-bottom:16px;flex-wrap:wrap;gap:10px;">
      <h3 class="display" style="margin:0;">Ventas (${state.sales.length})</h3>
      <div class="search"><input type="text" id="ventasSearchInput" placeholder="Buscar por folio, clienta o teléfono…" value="${esc(state.ventasSearch)}"></div>
    </div>
    ${state.sales.length===0 ? `<div class="empty"><div class="display">Aún no hay ventas</div><p>Las compras hechas por clientas desde el catálogo aparecerán aquí.</p></div>`
      : filtered.length===0 ? `<div class="empty"><div class="display">Sin resultados</div><p>Prueba con otro folio, nombre o teléfono.</p></div>`
      : `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Compra</th><th>Clienta</th><th>Fecha</th><th>Total compra</th><th>Saldo de su cuenta</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>

function saleDetail(s){
  const itemsRows = s.items.map(i => {

      return l ? (esc(l.provider)+' · '+loteDateRange(l)+' (x'+lb.qty+')') : ('Recepción no encontrada (x'+lb.qty+')');
    }).join('<br>') || '—';
    return `<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.price*i.qty)}</td><td>${loteInfo}</td></tr>`;
  }).join('');
  const saldo = customerSaldo(s.customerPhone);

  return `
    <button class="link-btn" id="backToVentas" style="margin-bottom:18px;">&larr; Volver a ventas</button>

function adminCuentas(){
  if(state.viewingCustomerPhone){
    const c = state.customers.find(x=>x.phone===state.viewingCustomerPhone);
    if(c) return customerAccountDetail(c);
  }
  const allCustomers = [...state.customers].sort((a,b)=> a.name.localeCompare(b.name));
  const search = (state.cuentasSearch||'').trim().toLowerCase();
  let filtered = allCustomers;
  if(search){
    filtered = filtered.filter(c => c.name.toLowerCase().includes(search) || c.phone.includes(search));
  }

  const pageInfo = paginate(filtered, state.cuentasPage);
  state.cuentasPage = pageInfo.page;
  const rows = pageInfo.items.map(c => {
    const hasSales = customerSales(c.phone).length > 0;
    const total = customerTotal(c.phone), abonado = customerAbonado(c.phone), saldo = customerSaldo(c.phone);
    const estadoBadge = !hasSales
      ? `<span class="badge pendiente">Sin compras</span>`
      : `<span class="badge ${saldo<=0?'liquidada':'pendiente'}">${saldo<=0?'Liquidada':'Pendiente'}</span>`;
    return `
    <tr>
      <td class="clickable" data-view-customer="${esc(c.phone)}">${esc(c.name)}<div class="muted">${esc(c.phone)}</div></td>
      <td class="clickable" data-view-customer="${esc(c.phone)}">${money(total)}</td>
      <td class="clickable" data-view-customer="${esc(c.phone)}">${money(abonado)}</td>
      <td class="clickable" data-view-customer="${esc(c.phone)}">${money(saldo)}</td>
      <td class="clickable" data-view-customer="${esc(c.phone)}">${estadoBadge}</td>
      <td style="text-align:right;"><button class="btn btn-sm btn-danger" data-delete-customer="${esc(c.phone)}">Eliminar</button></td>
    </tr>`;
  }).join('');

  return `
    <div class="row-between" style="margin-bottom:16px;flex-wrap:wrap;gap:10px;">
      <h3 class="display" style="margin:0;">Cuentas de clientas (${allCustomers.length})</h3>

        <button class="btn btn-gold btn-sm" id="btnAdminNewCustomer">Dar de alta clienta</button>
      </div>
    </div>
    ${allCustomers.length===0 ? `<div class="empty"><div class="display">Aún no hay clientas registradas</div><p>Da de alta a la primera con el botón de arriba, o aparecerán solas cuando alguien compre o solicite un artículo.</p></div>`
      : filtered.length===0 ? `<div class="empty"><div class="display">Sin resultados</div><p>Prueba con otro nombre o teléfono.</p></div>`
      : `
    <div class="table-wrap"><table>
      <thead><tr><th>Clienta</th><th>Total comprado</th><th>Total abonado</th><th>Saldo</th><th>Estado</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${paginationHtml('cuentas', pageInfo.page, pageInfo.totalPages)}
    `}
  `;
}

const PAGE_SIZE = 20;
function paginate(items, currentPage){
  const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
  const page = Math.min(Math.max(1, currentPage||1), totalPages);
  return { items: items.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE), page, totalPages };
}
function paginationHtml(kind, page, totalPages){
  if(totalPages <= 1) return '';
  return `
    <div class="row-between" style="margin-top:18px;">
      <button type="button" class="btn btn-ghost btn-sm" data-page-prev="${kind}" ${page<=1?'disabled':''}>&larr; Anterior</button>
      <span class="muted">Página ${page} de ${totalPages}</span>
      <button type="button" class="btn btn-ghost btn-sm" data-page-next="${kind}" ${page>=totalPages?'disabled':''}>Siguiente &rarr;</button>
    </div>`;
}

function isQuickRange(period, start, end){
  const r = quickRange(period);
  return r.start === start && r.end === end;
}

// Confirmación y avisos propios de la app: los diálogos nativos del navegador (confirm/alert)
// pueden quedar bloqueados dentro del entorno donde corre esta app, así que se usan estos en su lugar.
// Registra el adeudo que una clienta ya traía de antes de usar la app, como una compra
// especial sin artículos reales — no descuenta inventario ni cuenta para los reportes de
// ganancia por recepción (esos siguen basándose solo en lo vendido desde el catálogo).
async function recordOpeningBalance(phone, name, amount){
  const sale = {
    id: genId('V'),
    customerPhone: phone,
    customerName: name,
    items: [{productId: null, name: 'Saldo inicial (antes de este sistema)', qty: 1, price: amount, loteBreakdown: []}],
    total: amount,
    date: new Date().toISOString(),
  };
  state.sales.push(sale);
  const ok = await insertRow('sales', saleToDb, sale);
  if(!ok){ state.sales = state.sales.filter(s => s.id !== sale.id); }
  return ok;
}

function generateRandomPassword(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  let pw = '';
  for(let i=0;i<8;i++) pw += chars[Math.floor(Math.random()*chars.length)];
  return pw;
}

/* ================= EVENTS ================= */
function bindEvents(){
  // Logo: siempre regresa al inicio (catálogo)
  const logoHome = document.getElementById('logoHome');
  if(logoHome) logoHome.onclick = () => {
    state.view = 'catalogo';
    state.category = 'Todas';
    state.search = '';
    state.catalogMenuOpen = false;
    state.cartOpen = false;
    render();
  };

  // Rail: tres círculos (Catálogo / Mi Cuenta / Admin)
  document.querySelectorAll('[data-nav-circle]').forEach(b => b.onclick = () => {
    const key = b.dataset.navCircle;
    if(key === 'catalogo'){
      if(state.view === 'catalogo' && state.catalogMenuOpen){ state.catalogMenuOpen = false; }
      else { state.view = 'catalogo'; state.catalogMenuOpen = true; }
    } else {
      state.view = key;
      state.catalogMenuOpen = false;
    }
    render();
  });
  document.querySelectorAll('[data-nav-leaf-category]').forEach(b => b.onclick = () => {
    state.view = 'catalogo';
    state.category = b.dataset.navLeafCategory;
    state.catalogMenuOpen = false;
    render();
  });
  document.querySelectorAll('[data-atab]').forEach(b => b.onclick = () => {
    state.adminTab = b.dataset.atab;
    state.viewingSaleId = null;
    state.viewingCustomerPhone = null;
    state.viewingLoteId = null;
    state.viewingProductTraceId = null;
    state.creatingLote = false;
    state.editingProduct = null;
    state.ventasPage = 1;
    state.cuentasPage = 1;
    render();
  });

  // Catalogo
  document.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { state.category = b.dataset.cat; render(); });
  const searchInput = document.getElementById('searchInput');
  if(searchInput) searchInput.oninput = (e) => { state.search = e.target.value; render(); };
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => addToCart(b.dataset.add));

  // Cart / drawer
  const fab = document.getElementById('cartFab');
  if(fab) fab.onclick = () => { state.cartOpen = true; render(); };
  const overlay = document.getElementById('overlay');
  if(overlay) overlay.onclick = () => { state.cartOpen = false; render(); };
  const drawerClose = document.getElementById('drawerClose');
  if(drawerClose) drawerClose.onclick = () => { state.cartOpen = false; render(); };
  document.querySelectorAll('[data-qty-plus]').forEach(b => b.onclick = () => changeQty(b.dataset.qtyPlus, 1));
  document.querySelectorAll('[data-qty-minus]').forEach(b => b.onclick = () => changeQty(b.dataset.qtyMinus, -1));
  const checkoutBtn = document.getElementById('checkoutBtn');
  if(checkoutBtn) checkoutBtn.onclick = () => {
    if(cartLines().length === 0) return;
    if(state.clientPhone){ submitCartRequest(); }
    else { state.modal = {type:'requestInfo', error:''}; render(); }
  };

  // Cuenta
  const cuentaEnter = document.getElementById('cuentaEnter');
  if(cuentaEnter) cuentaEnter.onclick = enterCuenta;
  const cuentaPhone = document.getElementById('cuentaPhone');
  if(cuentaPhone) cuentaPhone.oninput = (e)=>{ state.cuentaPhoneInput = e.target.value; };
  const cuentaName = document.getElementById('cuentaName');
  if(cuentaName) cuentaName.oninput = (e)=>{ state.cuentaNameInput = e.target.value; };
  const cuentaPassword = document.getElementById('cuentaPassword');
  if(cuentaPassword) cuentaPassword.oninput = (e)=>{ state.cuentaPasswordInput = e.target.value; };
  const cuentaSalir = document.getElementById('cuentaSalir');
  if(cuentaSalir) cuentaSalir.onclick = () => { state.clientPhone=''; state.clientName=''; clearClientSession(); render(); };
  const btnChangePassword = document.getElementById('btnChangePassword');
  if(btnChangePassword) btnChangePassword.onclick = () => { state.modal = {type:'changePassword', error:''}; render(); };
  document.querySelectorAll('[data-ticket]').forEach(b => b.onclick = () => openTicket(b.dataset.ticket));
  document.querySelectorAll('[data-statement]').forEach(b => b.onclick = () => openStatement(b.dataset.statement));
  document.querySelectorAll('[data-complete-request]').forEach(b => b.onclick = () => openCompleteRequest(b.dataset.completeRequest));
  const btnSelfAbono = document.getElementById('btnSelfAbono');
  if(btnSelfAbono) btnSelfAbono.onclick = openSelfAbono;

  // Reportes
  document.querySelectorAll('[data-quick-range]').forEach(b => b.onclick = () => {
    const r = quickRange(b.dataset.quickRange);
    state.reportRangeStart = r.start;
    state.reportRangeEnd = r.end;
    state.reportSelectedLoteId = null;
    render();
  });
  const rpApply = document.getElementById('rp_apply');
  if(rpApply) rpApply.onclick = () => {
    state.reportRangeStart = document.getElementById('rp_start').value;
    state.reportRangeEnd = document.getElementById('rp_end').value;
    state.reportSelectedLoteId = null;
    render();
  };
  const rpLoteSelect = document.getElementById('rp_lote_select');
  if(rpLoteSelect) rpLoteSelect.onchange = () => {
    const val = rpLoteSelect.value;
    if(val){
      const l = state.lotes.find(x=>x.id===val);
      if(l){
        state.reportSelectedLoteId = l.id;
        state.reportRangeStart = l.date;
        state.reportRangeEnd = l.endDate || l.date;
        render();
      }
    } else {
      state.reportSelectedLoteId = null;
      render();
    }
  };
  const rpClearLote = document.getElementById('rp_clear_lote');
  if(rpClearLote) rpClearLote.onclick = () => {
    state.reportSelectedLoteId = null;
    render();
  };

  // Admin gate — login real con Supabase Auth
  const adminEnter = document.getElementById('adminEnter');
  if(adminEnter) adminEnter.onclick = async () => {
    const email = document.getElementById('adminEmail').value.trim();
    const pass = document.getElementById('adminPass').value;
    if(!email || !pass){ state.adminPassError = 'Ingresa tu correo y contraseña.'; render(); return; }
    adminEnter.disabled = true;
    adminEnter.textContent = 'Entrando…';
    const {error} = await sb.auth.signInWithPassword({email, password:pass});
    if(error){
      state.adminPassError = 'Correo o contraseña incorrectos.';
      state.adminAuthed = false;
    } else {
      state.adminPassError = '';
      state.adminAuthed = true;
    }
    render();
  };
  const adminSalir = document.getElementById('adminSalir');

  const adminForgotLink = document.getElementById('adminForgotLink');

  };
  const afpSend = document.getElementById('afp_send');

    afpSend.disabled = true; afpSend.textContent = 'Enviando…';
    const { error } = await sb.auth.resetPasswordForEmail(email, {redirectTo: APP_URL});
    state.modal.error = error ? 'No se pudo enviar el correo. Intenta de nuevo en unos minutos.' : '';
    state.modal.sent = !error;
    render();
  };
  const arpSave = document.getElementById('arp_save');
  if(arpSave) arpSave.onclick = async () => {
    const nw = document.getElementById('arp_new').value;
    const confirmNew = document.getElementById('arp_confirm').value;
    if(nw.length < 6){ state.modal.error = 'La nueva contraseña debe tener al menos 6 caracteres.'; render(); return; }
    if(nw !== confirmNew){ state.modal.error = 'Las contraseñas no coinciden.'; render(); return; }
    arpSave.disabled = true; arpSave.textContent = 'Guardando…';
    const { error } = await sb.auth.updateUser({password: nw});
    if(error){ state.modal.error = 'No se pudo actualizar la contraseña. Pide un nuevo enlace de recuperación.'; render(); return; }
    state.modal = null;
    state.adminAuthed = true;
    notify('Tu contraseña se actualizó correctamente. Ya quedaste dentro.');

  // Inventario (solo edición: el alta de artículos se hace desde Recepciones)
  document.querySelectorAll('[data-edit-product]').forEach(b => b.onclick = () => {
    const prod = state.products.find(p=>p.id===b.dataset.editProduct);
    state.editingProduct = prod;
    state.tempImageData = prod ? (prod.image || '') : '';
    state.productFormDraft = prod ? {name:prod.name, sku:prod.sku, category:prod.category, price:prod.price, desc:prod.desc||'', onSale:!!prod.onSale, salePrice:prod.salePrice!=null?prod.salePrice:''} : null;
    render();
  });
  document.querySelectorAll('[data-del-product]').forEach(b => b.onclick = () => deleteProduct(b.dataset.delProduct));
  const pfSave = document.getElementById('pf_save');
  if(pfSave) pfSave.onclick = saveProductForm;
  const pfCancel = document.getElementById('pf_cancel');
  if(pfCancel) pfCancel.onclick = () => { state.editingProduct = null; state.tempImageData=''; state.productFormDraft=null; render(); };
  bindCategoryToggle('pf_category');
  document.querySelectorAll('[data-pf-onsale]').forEach(b => b.onclick = () => {

  });
  const pfImageFile = document.getElementById('pf_image_file');
  if(pfImageFile) pfImageFile.onchange = async (e) => {
    const file = e.target.files[0];

    try{
      const dataUrl = await resizeImageFile(file, 700, 0.82);
      captureProductFormFields();
      state.tempImageData = dataUrl;
      render();
    }catch(err){ notify('No se pudo procesar la imagen. Intenta con otra foto.'); }
  };
  const pfImageRemove = document.getElementById('pf_image_remove');
  if(pfImageRemove) pfImageRemove.onclick = () => { captureProductFormFields(); state.tempImageData=''; render(); };
  document.querySelectorAll('[data-trace-product]').forEach(b => b.onclick = () => { state.viewingProductTraceId = b.dataset.traceProduct; render(); });

  document.querySelectorAll('[data-preview-image]').forEach(el => el.onclick = () => {

  document.querySelectorAll('[data-mark-sold]').forEach(b => b.onclick = () => {

  const msAll = document.getElementById('ms_all');
  if(msAll) msAll.onclick = () => {
    const p = state.products.find(pp=>pp.id===state.modal.productId);

    if(p && qtyEl) qtyEl.value = productStock(p);
  };
  document.querySelectorAll('[data-ms-method]').forEach(b => b.onclick = () => {
    const qtyEl = document.getElementById('ms_qty');
    if(qtyEl) state.modal.qty = qtyEl.value;

    render();
  });
  const msSave = document.getElementById('ms_save');
  if(msSave) msSave.onclick = async () => {
    const p = state.products.find(pp=>pp.id===state.modal.productId);
    if(!p) return;
    const qty = Number(document.getElementById('ms_qty').value || 0);
    const method = state.modal.method || 'efectivo';
    const stock = productStock(p);
    if(qty <= 0 || qty > stock){ state.modal.error = 'Ingresa una cantidad entre 1 y ' + stock + '.'; render(); return; }

    msSave.disabled = true; msSave.textContent = 'Guardando…';
    const { data: breakdownResult, error } = await sb.rpc('consume_stock_multi', {items: [{productId: p.id, qty}]});
    if(error){
      state.modal.error = 'No se pudo descontar la existencia. Detalle técnico: ' + (error.message||'desconocido');
      msSave.disabled = false; msSave.textContent = 'Registrar venta';
      render();
      return;
    }
    const { data: freshRow } = await sb.from('products').select('*').eq('id', p.id).maybeSingle();
    if(freshRow){
      const updated = dbToProduct(freshRow);
      const idx = state.products.findIndex(pp=>pp.id===updated.id);
      if(idx >= 0) state.products[idx] = updated;
    }

    // Registra la venta (a la cuenta especial de mostrador) para que cuente en tus reportes.
    await ensureCounterCustomer();
    const price = effectivePrice(p);
    const bd = (breakdownResult||[]).find(b=>b.productId===p.id);
    const sale = {
      id: genId('V'),
      customerPhone: COUNTER_PHONE,
      customerName: COUNTER_NAME,
      items: [{productId:p.id, name:p.name, qty, price, loteBreakdown: bd?bd.loteBreakdown:[]}],
      total: price*qty,
      date: new Date().toISOString(),
    };
    state.sales.push(sale);
    const savedSale = await insertRow('sales', saleToDb, sale);
    if(savedSale){
      const payment = {id:genId('AB'), customerPhone:COUNTER_PHONE, amount: sale.total, date: new Date().toISOString().slice(0,10), method: method==='tarjeta'?'Tarjeta':'Efectivo'};
      state.payments.push(payment);
      await insertRow('payments', paymentToDb, payment);
    }

    state.modal = null;
    if(!savedSale){
      notify('Se descontó la existencia, pero no se pudo registrar la venta para tus reportes. Detalle técnico: ' + (lastSaveError||'desconocido') + '. El inventario ya quedó actualizado correctamente.');

  const lfTarget = document.getElementById('lf_target');
  if(lfTarget) lfTarget.onchange = () => {

  };
  document.querySelectorAll('[data-row-existing]').forEach(sel => sel.onchange = () => {
    captureLoteFormState();

    render();

  document.querySelectorAll('[data-row-remove]').forEach(b => b.onclick = () => {
    captureLoteFormState();
